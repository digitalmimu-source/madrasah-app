<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekapan Absensi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
        }
        h2 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            font-size: 14px;
            margin-right: 5px;
        }
        .btn-edit {
            background-color: #ffc107;
            color: #000;
        }
        .btn-delete {
            background-color: #dc3545;
        }
        .btn:hover {
            opacity: 0.85;
        }
        
        /* Style Modal Edit */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.5); 
        }
        .modal-content {
            background-color: #fff;
            margin: 10% auto;
            padding: 20px;
            border-radius: 5px;
            width: 350px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .modal-footer {
            text-align: right;
        }
        .btn-close {
            background-color: #6c757d;
        }
        .btn-save {
            background-color: #28a745;
        }
    </style>
</head>
<body>

    <h2>Rekapan Absensi</h2>

    <!-- Tabel Rekapan Absensi (Kosong dari data default) -->
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Tanggal</th>
                <th>Status</th>
                <th>Keterangan</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tabel-absensi-body">
            <!-- Data dari Database akan dimasukkan di sini secara otomatis -->
        </tbody>
    </table>

    <!-- Modal Form Edit Absensi -->
    <div id="modalEdit" class="modal">
        <div class="modal-content">
            <h3>Edit Absensi</h3>
            <form id="formEditAbsensi">
                <input type="hidden" id="editId">
                
                <div class="form-group">
                    <label for="editNama">Nama:</label>
                    <input type="text" id="editNama" required>
                </div>
                
                <div class="form-group">
                    <label for="editTanggal">Tanggal:</label>
                    <input type="date" id="editTanggal" required>
                </div>
                
                <div class="form-group">
                    <label for="editStatus">Status:</label>
                    <select id="editStatus" required>
                        <option value="Hadir">Hadir</option>
                        <option value="Izin">Izin</option>
                        <option value="Sakit">Sakit</option>
                        <option value="Alpha">Alpha</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="editKeterangan">Keterangan:</label>
                    <input type="text" id="editKeterangan">
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-close" onclick="tutupModal()">Batal</button>
                    <button type="submit" class="btn btn-save">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Array penampung data dari database
        let dataAbsensi = [];

        // 1. FUNGSI MENGAMBIL DATA DARI DATABASE VIA API
        async function muatDataAbsensi() {
            try {
                // Ganti URL endpoint berikut dengan endpoint backend/API Anda
                const response = await fetch('/api/get-absensi'); 
                const result = await response.json();
                
                dataAbsensi = result.data; 
                renderTabelAbsensi();
            } catch (error) {
                console.error('Gagal mengambil data dari DB:', error);
            }
        }

        // 2. FUNGSI MENAMPILKAN DATA KE TABEL HTML
        function renderTabelAbsensi() {
            const tbody = document.getElementById('tabel-absensi-body');
            tbody.innerHTML = ''; 

            if (dataAbsensi.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Belum ada data absensi.</td></tr>`;
                return;
            }

            dataAbsensi.forEach((item, index) => {
                const row = `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.nama}</td>
                        <td>${item.tanggal}</td>
                        <td>${item.status}</td>
                        <td>${item.keterangan || '-'}</td>
                        <td>
                            <button class="btn btn-edit" onclick="bukaModalEdit('${item.id}')">Edit</button>
                            <button class="btn btn-delete" onclick="hapusAbsensi('${item.id}')">Hapus</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // 3. FUNGSI HAPUS DATA ABSENSI
        async function hapusAbsensi(id) {
            if (confirm('Apakah Anda yakin ingin menghapus data absensi ini?')) {
                try {
                    // Ganti URL endpoint backend untuk hapus data
                    const response = await fetch(`/api/delete-absensi/${id}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        alert('Data berhasil dihapus');
                        muatDataAbsensi(); // Reload data dari DB
                    } else {
                        alert('Gagal menghapus data di database.');
                    }
                } catch (error) {
                    console.error('Error saat menghapus data:', error);
                }
            }
        }

        // 4. FUNGSI EDIT DATA ABSENSI
        function bukaModalEdit(id) {
            const item = dataAbsensi.find(d => d.id == id);
            if (!item) return;

            // Isi nilai form modal berdasarkan data yang dipilih
            document.getElementById('editId').value = item.id;
            document.getElementById('editNama').value = item.nama;
            document.getElementById('editTanggal').value = item.tanggal;
            document.getElementById('editStatus').value = item.status;
            document.getElementById('editKeterangan').value = item.keterangan || '';

            // Tampilkan modal
            document.getElementById('modalEdit').style.display = 'block';
        }

        function tutupModal() {
            document.getElementById('modalEdit').style.display = 'none';
        }

        // Handle Submit Form Edit
        document.getElementById('formEditAbsensi').addEventListener('submit', async function(e) {
            e.preventDefault();

            const id = document.getElementById('editId').value;
            const updatedData = {
                nama: document.getElementById('editNama').value,
                tanggal: document.getElementById('editTanggal').value,
                status: document.getElementById('editStatus').value,
                keterangan: document.getElementById('editKeterangan').value
            };

            try {
                // Ganti URL endpoint backend untuk update data
                const response = await fetch(`/api/update-absensi/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updatedData)
                });

                if (response.ok) {
                    alert('Data absensi berhasil diperbarui!');
                    tutupModal();
                    muatDataAbsensi(); // Reload data terbaru dari DB
                } else {
                    alert('Gagal memperbarui data di database.');
                }
            } catch (error) {
                console.error('Error saat memperbarui data:', error);
            }
        });

        // Jalankan pemanggilan data saat halaman pertama dimuat
        document.addEventListener('DOMContentLoaded', muatDataAbsensi);
    </script>
</body>
</html>
