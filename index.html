                      <th className="p-2 border border-slate-300">Bentuk Pelanggaran</th>
                      <th className="p-2 border border-slate-300 text-center">Kategori</th>
                      <th className="p-2 border border-slate-300 text-center">Poin</th>
                      <th className="p-2 border border-slate-300">Pelapor</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredViolations.length === 0 ? (
                      <tr>
                        <td colSpan={7} className="p-6 text-center text-slate-400">Tidak ada catatan pelanggaran pada kriteria filter ini.</td>
                      </tr>
                    ) : (
                      filteredViolations.map((item, idx) => (
                        <tr key={item.id} className="border-b border-slate-200">
                          <td className="p-2 border border-slate-300 text-center font-bold">{idx + 1}</td>
                          <td className="p-2 border border-slate-300 font-bold text-slate-700">{item.date}</td>
                          <td className="p-2 border border-slate-300 font-bold">{item.studentName}<br/><span className="text-[10px] text-emerald-800">Kelas {item.studentClass}</span></td>
                          <td className="p-2 border border-slate-300 font-bold text-rose-900">{item.violationName}</td>
                          <td className="p-2 border border-slate-300 text-center font-bold">{item.category}</td>
                          <td className="p-2 border border-slate-300 text-center font-bold text-rose-700">+{item.points}</td>
                          <td className="p-2 border border-slate-300">{item.reporter}</td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            )}

            <div className="pt-8 flex justify-between text-xs font-bold text-slate-800 leading-tight border-t border-slate-200">
              <div className="text-center space-y-12">
                <p>Mengetahui,<br/>Kepala {madrasahInfo.name}</p>
                <div>
                  <p className="underline font-black">{madrasahInfo.headmaster}</p>
                  <p className="text-[10px] text-slate-500 font-mono">NIP: {madrasahInfo.headmasterNip}</p>
                </div>
              </div>

              <div className="text-center space-y-12">
                <p>Dicetak Pada: {new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}<br/>Petugas / Guru Pengajar</p>
                <div>
                  <p className="underline font-black">{currentUser ? currentUser.name : 'Ustadz Abdullah, M.Pd'}</p>
                  <p className="text-[10px] text-slate-500 font-mono">NIP: {currentUser ? currentUser.nip || '-' : '-'}</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function GoogleSheetsModal({
      spreadsheetUrl,
      setSpreadsheetUrl,
      madrasahInfo,
      setMadrasahInfo,
      onClose,
      teachers,
      students,
      journals,
      masterViolations,
      violationLogs,
      attendanceLogs,
      studentGrades
    }) {
      const [activeTab, setActiveTab] = useState('identitas');
      const [urlInput, setUrlInput] = useState(spreadsheetUrl);
      const [infoForm, setInfoForm] = useState(madrasahInfo);
      const [savedMsg, setSavedMsg] = useState('');

      const handleSaveInfo = () => {
        setMadrasahInfo(infoForm);
        setSavedMsg('✅ Identitas & Logo Madrasah berhasil diperbarui!');
        setTimeout(() => setSavedMsg(''), 2500);
      };

      const handleSaveDbUrl = () => {
        localStorage.setItem('simadrasah_sheet_url', urlInput);
        setSpreadsheetUrl(urlInput);
        setSavedMsg('✅ URL Database Google Sheets berhasil disimpan!');
        setTimeout(() => setSavedMsg(''), 2500);
      };

      const handleLogoFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 2 * 1024 * 1024) {
            alert('Ukuran file logo maksimal 2MB!');
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            setInfoForm(prev => ({ ...prev, logoUrl: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleExportJSON = () => {
        const backupData = {
          madrasahInfo: infoForm,
          teachers,
          students,
          journals,
          masterViolations,
          violationLogs,
          attendanceLogs,
          studentGrades,
          exportDate: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `SIMADRASAH_Backup_${new Date().toISOString().split('T')[0]}.json`;
        link.click();
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-white max-w-xl w-full p-6 rounded-3xl space-y-4 shadow-2xl overflow-y-auto max-h-[90vh]">
            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
              <h3 className="font-bold text-base flex items-center gap-2 text-slate-800">
                <Icon name="Settings" className="text-emerald-700" size={20} /> Pengaturan Sistem & Identitas
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1 cursor-pointer">
                <Icon name="X" size={20} />
              </button>
            </div>

            <div className="flex bg-slate-100 p-1 rounded-2xl text-xs font-bold">
              <button
                type="button"
                onClick={() => setActiveTab('identitas')}
                className={`flex-1 py-2.5 rounded-xl transition cursor-pointer flex items-center justify-center gap-2 ${
                  activeTab === 'identitas' ? 'bg-white text-emerald-800 shadow-xs' : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                <Icon name="Building" size={16} /> Identitas Madrasah & Logo
              </button>
              <button
                type="button"
                onClick={() => setActiveTab('database')}
                className={`flex-1 py-2.5 rounded-xl transition cursor-pointer flex items-center justify-center gap-2 ${
                  activeTab === 'database' ? 'bg-white text-emerald-800 shadow-xs' : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                <Icon name="Database" size={16} /> Google Sheets Sync
              </button>
            </div>

            {savedMsg && (
              <div className="p-3 bg-emerald-100 border border-emerald-300 text-emerald-900 rounded-xl text-xs font-bold">
                {savedMsg}
              </div>
            )}

            {activeTab === 'identitas' && (
              <div className="space-y-3 text-xs">
                <div>
                  <label className="block font-bold text-slate-700 mb-1">Nama Resmi Madrasah</label>
                  <input
                    type="text"
                    value={infoForm.name}
                    onChange={(e) => setInfoForm({ ...infoForm, name: e.target.value })}
                    placeholder="MI MADINATUL ULUM"
                    className="w-full p-2.5 border border-slate-200 rounded-xl font-bold text-slate-800 outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>

                <div>
                  <label className="block font-bold text-slate-700 mb-1">Sub Judul / Program</label>
                  <input
                    type="text"
                    value={infoForm.subTitle}
                    onChange={(e) => setInfoForm({ ...infoForm, subTitle: e.target.value })}
                    placeholder="SIMADRASAH Kelas 1 - 6"
                    className="w-full p-2.5 border border-slate-200 rounded-xl outline-none"
                  />
                </div>

                <div>
                  <label className="block font-bold text-slate-700 mb-1">Alamat Lengkap Kop Surat</label>
                  <input
                    type="text"
                    value={infoForm.address}
                    onChange={(e) => setInfoForm({ ...infoForm, address: e.target.value })}
                    placeholder="Jl. KH. Abdul Wahab No. 12, Sidoarjo, Jawa Timur"
                    className="w-full p-2.5 border border-slate-200 rounded-xl outline-none"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Nomor Telepon / Kontak</label>
                    <input
                      type="text"
                      value={infoForm.phone}
                      onChange={(e) => setInfoForm({ ...infoForm, phone: e.target.value })}
                      placeholder="(031) 890123"
                      className="w-full p-2.5 border border-slate-200 rounded-xl outline-none"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Website / Email</label>
                    <input
                      type="text"
                      value={infoForm.website}
                      onChange={(e) => setInfoForm({ ...infoForm, website: e.target.value })}
                      placeholder="simadrasah.sch.id"
                      className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-mono"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Nama Kepala Madrasah</label>
                    <input
                      type="text"
                      value={infoForm.headmaster}
                      onChange={(e) => setInfoForm({ ...infoForm, headmaster: e.target.value })}
                      placeholder="Drs. H. M. Ridwan, M.Pd"
                      className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-bold text-slate-800"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">NIP Kepala Madrasah</label>
                    <input
                      type="text"
                      value={infoForm.headmasterNip}
                      onChange={(e) => setInfoForm({ ...infoForm, headmasterNip: e.target.value })}
                      placeholder="19750820 200212 1 001"
                      className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-mono"
                    />
                  </div>
                </div>

                <div className="p-3 bg-slate-50 border border-slate-200 rounded-2xl space-y-2">
                  <label className="block font-bold text-slate-700 text-xs">Logo Madrasah (Gambar / File)</label>
                  <div className="flex items-center gap-3">
                    {infoForm.logoUrl ? (
                      <div className="relative group">
                        <img src={infoForm.logoUrl} alt="Logo Madrasah" className="w-16 h-16 object-contain bg-white rounded-xl border p-1 shadow-xs" />
                        <button
                          type="button"
                          onClick={() => setInfoForm({ ...infoForm, logoUrl: '' })}
                          className="absolute -top-2 -right-2 bg-rose-600 text-white p-1 rounded-full text-xs shadow-md"
                          title="Hapus Logo"
                        >
                          <Icon name="X" size={12} />
                        </button>
                      </div>
                    ) : (
                      <div className="w-16 h-16 bg-slate-200 text-slate-400 rounded-xl flex items-center justify-center font-bold text-xs border border-dashed border-slate-300">
                        No Logo
                      </div>
                    )}
                    <div className="flex-1 space-y-1">
                      <input
                        type="file"
                        accept="image/*"
                        onChange={handleLogoFileUpload}
                        className="block w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-50 file:text-emerald-800 hover:file:bg-emerald-100 cursor-pointer"
                      />
                      <p className="text-[10px] text-slate-400">Atau tempelkan URL Gambar di bawah ini:</p>
                      <input
                        type="text"
                        value={infoForm.logoUrl}
                        onChange={(e) => setInfoForm({ ...infoForm, logoUrl: e.target.value })}
                        placeholder="https://.../logo.png"
                        className="w-full p-2 bg-white border border-slate-200 rounded-xl text-xs font-mono outline-none"
                      />
                    </div>
                  </div>
                </div>

                <div className="pt-2">
                  <button
                    type="button"
                    onClick={handleSaveInfo}
                    className="w-full bg-emerald-800 text-white font-bold py-2.5 rounded-xl text-xs hover:bg-emerald-900 shadow-md transition cursor-pointer"
                  >
                    Simpan Identitas Madrasah
                  </button>
                </div>
              </div>
            )}

            {activeTab === 'database' && (
              <div className="space-y-4 text-xs">
                <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl space-y-2">
                  <label className="block font-bold text-emerald-900 text-xs">
                    <Icon name="Database" size={14} className="inline mr-1" /> Web App Endpoint (Google Apps Script)
                  </label>
                  <input
                    type="text"
                    value={urlInput}
                    onChange={(e) => setUrlInput(e.target.value)}
                    placeholder="https://script.google.com/macros/s/.../exec"
                    className="w-full p-2.5 bg-white border border-emerald-300 rounded-xl text-xs font-mono outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                  <p className="text-[11px] text-emerald-700">
                    Masukkan Web App URL dari Google Apps Script untuk menghubungkan data dengan Google Sheets.
                  </p>
                  <button
                    type="button"
                    onClick={handleSaveDbUrl}
                    className="bg-emerald-800 text-white px-4 py-2 rounded-xl font-bold text-xs hover:bg-emerald-900 cursor-pointer"
                  >
                    Simpan Endpoint DB
                  </button>
                </div>

                <div className="border border-slate-200 p-4 rounded-2xl space-y-3">
                  <p className="font-bold text-slate-800">Cadangan Data (Backup & Restore):</p>
                  <button
                    type="button"
                    onClick={handleExportJSON}
                    className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 px-3 rounded-xl transition flex items-center justify-center gap-2 cursor-pointer text-xs"
                  >
                    <Icon name="Download" size={14} /> Unduh Backup Data Lengkap (JSON)
                  </button>
                </div>
              </div>
            )}

            <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
              <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-100 rounded-xl font-bold text-slate-600 cursor-pointer text-xs">
                Tutup
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
