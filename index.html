    <script type="text/babel">
    // Engine Generator QR Code Standar ISO/IEC 18004 Murni (Tanpa Ketergantungan CDN)
    const qrcodeEngine = (function() {
      var PAD0 = 0xEC, PAD1 = 0x11;

      function QR8bitByte(data) {
        this.mode = 4;
        this.data = data;
      }
      QR8bitByte.prototype = {
        getLength: function() { return this.data.length; },
        write: function(buffer) {
          for (var i = 0; i < this.data.length; i++) {
            buffer.put(this.data.charCodeAt(i), 8);
          }
        }
      };

      function QRCode(typeNumber, errorCorrectionLevel) {
        this.typeNumber = typeNumber;
        this.errorCorrectionLevel = errorCorrectionLevel;
        this.modules = null;
        this.moduleCount = 0;
        this.dataCache = null;
        this.dataList = [];
      }

      QRCode.prototype = {
        addData: function(data) {
          this.dataList.push(new QR8bitByte(data));
          this.dataCache = null;
        },
        isDark: function(row, col) {
          if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
            throw new Error(row + "," + col);
          }
          return this.modules[row][col];
        },
        getModuleCount: function() { return this.moduleCount; },
        make: function() { this.makeImpl(false, this.getBestMaskPattern()); },
        makeImpl: function(test, maskPattern) {
          this.moduleCount = this.typeNumber * 4 + 17;
          this.modules = new Array(this.moduleCount);
          for (var row = 0; row < this.moduleCount; row++) {
            this.modules[row] = new Array(this.moduleCount);
            for (var col = 0; col < this.moduleCount; col++) {
              this.modules[row][col] = null;
            }
          }
          this.setupPositionDetectionPattern(0, 0);
          this.setupPositionDetectionPattern(this.moduleCount - 7, 0);
          this.setupPositionDetectionPattern(0, this.moduleCount - 7);
          this.setupPositionAdjustPattern();
          this.setupTimingPattern();
          this.setupTypeInfo(test, maskPattern);
          if (this.typeNumber >= 7) this.setupTypeNumber(test);
          if (this.dataCache == null) {
            this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectionLevel, this.dataList);
          }
          this.mapData(this.dataCache, maskPattern);
        },
        setupPositionDetectionPattern: function(row, col) {
          for (var r = -1; r <= 7; r++) {
            if (row + r <= -1 || this.moduleCount <= row + r) continue;
            for (var c = -1; c <= 7; c++) {
              if (col + c <= -1 || this.moduleCount <= col + c) continue;
              if ((0 <= r && r <= 6 && (c == 0 || c == 6)) || (0 <= c && c <= 6 && (r == 0 || r == 6)) || (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
                this.modules[row + r][col + c] = true;
              } else {
                this.modules[row + r][col + c] = false;
              }
            }
          }
        },
        getBestMaskPattern: function() {
          var minLostPoint = 0, bestMaskPattern = 0;
          for (var i = 0; i < 8; i++) {
            this.makeImpl(true, i);
            var lostPoint = QRUtil.getLostPoint(this);
            if (i == 0 || minLostPoint > lostPoint) {
              minLostPoint = lostPoint;
              bestMaskPattern = i;
            }
          }
          return bestMaskPattern;
        },
        setupTimingPattern: function() {
          for (var r = 8; r < this.moduleCount - 8; r++) {
            if (this.modules[r][6] != null) continue;
            this.modules[r][6] = (r % 2 == 0);
          }
          for (var c = 8; c < this.moduleCount - 8; c++) {
            if (this.modules[6][c] != null) continue;
            this.modules[6][c] = (c % 2 == 0);
          }
        },
        setupPositionAdjustPattern: function() {
          var pos = QRUtil.getPatternPosition(this.typeNumber);
          for (var i = 0; i < pos.length; i++) {
            for (var j = 0; j < pos.length; j++) {
              var row = pos[i], col = pos[j];
              if (this.modules[row][col] != null) continue;
              for (var r = -2; r <= 2; r++) {
                for (var c = -2; c <= 2; c++) {
                  if (r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0)) {
                    this.modules[row + r][col + c] = true;
                  } else {
                    this.modules[row + r][col + c] = false;
                  }
                }
              }
            }
          }
        },
        setupTypeNumber: function(test) {
          var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
          for (var i = 0; i < 18; i++) {
            var mod = (!test && ((bits >> i) & 1) == 1);
            this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
            this.modules[i % 3 + this.moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
          }
        },
        setupTypeInfo: function(test, maskPattern) {
          var data = (QRErrorCorrectionLevel[this.errorCorrectionLevel] << 3) | maskPattern;
          var bits = QRUtil.getBCHTypeInfo(data);
          for (var i = 0; i < 15; i++) {
            var mod = (!test && ((bits >> i) & 1) == 1);
            if (i < 6) this.modules[i][8] = mod;
            else if (i < 8) this.modules[i + 1][8] = mod;
            else this.modules[this.moduleCount - 15 + i][8] = mod;

            if (i < 8) this.modules[8][this.moduleCount - i - 1] = mod;
            else if (i < 9) this.modules[8][15 - i - 1 + 1] = mod;
            else this.modules[8][15 - i - 1] = mod;
          }
          this.modules[this.moduleCount - 8][8] = (!test);
        },
        mapData: function(data, maskPattern) {
          var inc = -1, row = this.moduleCount - 1, bitIndex = 7, byteIndex = 0;
          for (var col = this.moduleCount - 1; col > 0; col -= 2) {
            if (col == 6) col--;
            while (true) {
              for (var c = 0; c < 2; c++) {
                if (this.modules[row][col - c] == null) {
                  var dark = false;
                  if (byteIndex < data.length) dark = (((data[byteIndex] >>> bitIndex) & 1) == 1);
                  var mask = QRUtil.getMask(maskPattern, row, col - c);
                  if (mask) dark = !dark;
                  this.modules[row][col - c] = dark;
                  bitIndex--;
                  if (bitIndex == -1) { byteIndex++; bitIndex = 7; }
                }
              }
              row += inc;
              if (row < 0 || this.moduleCount <= row) { row -= inc; inc = -inc; break; }
            }
          }
        }
      };

      QRCode.createData = function(typeNumber, errorCorrectionLevel, dataList) {
        var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);
        var buffer = new QRBitBuffer();
        for (var i = 0; i < dataList.length; i++) {
          var data = dataList[i];
          buffer.put(data.mode, 4);
          buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
          data.write(buffer);
        }
        var totalDataCount = 0;
        for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
        if (buffer.getLengthInBits() > totalDataCount * 8) {
          throw new Error("Data overflow!");
        }
        if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) buffer.put(0, 4);
        while (buffer.getLengthInBits() % 8 != 0) buffer.putBit(false);
        while (true) {
          if (buffer.getLengthInBits() >= totalDataCount * 8) break;
          buffer.put(PAD0, 8);
          if (buffer.getLengthInBits() >= totalDataCount * 8) break;
          buffer.put(PAD1, 8);
        }
        return QRCode.createBytes(buffer, rsBlocks);
      };

      QRCode.createBytes = function(buffer, rsBlocks) {
        var offset = 0, maxDcCount = 0, maxEcCount = 0;
        var dcdata = new Array(rsBlocks.length), ecdata = new Array(rsBlocks.length);
        for (var r = 0; r < rsBlocks.length; r++) {
          var dcCount = rsBlocks[r].dataCount;
          var ecCount = rsBlocks[r].totalCount - dcCount;
          maxDcCount = Math.max(maxDcCount, dcCount);
          maxEcCount = Math.max(maxEcCount, ecCount);
          dcdata[r] = new Array(dcCount);
          for (var i = 0; i < dcdata[r].length; i++) dcdata[r][i] = 0xff & buffer.buffer[i + offset];
          offset += dcCount;
          var rsPoly = QRUtil.getErrorCorrectionPolynomial(ecCount);
          var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
          var modPoly = rawPoly.mod(rsPoly);
          ecdata[r] = new Array(rsPoly.getLength() - 1);
          for (var i = 0; i < ecdata[r].length; i++) {
            var modIndex = i + modPoly.getLength() - ecdata[r].length;
            ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0;
          }
        }
        var totalCodeCount = 0;
        for (var i = 0; i < rsBlocks.length; i++) totalCodeCount += rsBlocks[i].totalCount;
        var data = new Array(totalCodeCount), index = 0;
        for (var i = 0; i < maxDcCount; i++) {
          for (var r = 0; r < rsBlocks.length; r++) {
            if (i < dcdata[r].length) data[index++] = dcdata[r][i];
          }
        }
        for (var i = 0; i < maxEcCount; i++) {
          for (var r = 0; r < rsBlocks.length; r++) {
            if (i < ecdata[r].length) data[index++] = ecdata[r][i];
          }
        }
        return data;
      };

      var QRErrorCorrectionLevel = { L: 1, M: 0, Q: 3, H: 2 };
      var QRUtil = {
        PATTERN_POSITION_TABLE: [
          [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34],
          [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50], [6, 30, 54]
        ],
        G15: (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
        G18: (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
        G15_MASK: (1 << 14) | (1 << 12) | (1 << 10) | (1 << 4) | (1 << 1),
        getBCHTypeInfo: function(data) {
          var d = data << 10;
          while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
            d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15)));
          }
          return ((data << 10) | d) ^ QRUtil.G15_MASK;
        },
        getBCHTypeNumber: function(data) {
          var d = data << 12;
          while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
            d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18)));
          }
          return (data << 12) | d;
        },
        getBCHDigit: function(data) {
          var digit = 0;
          while (data != 0) { digit++; data >>>= 1; }
          return digit;
        },
        getPatternPosition: function(typeNumber) {
          return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1];
        },
        getMask: function(maskPattern, i, j) {
          switch (maskPattern) {
            case 0: return (i + j) % 2 == 0;
            case 1: return i % 2 == 0;
            case 2: return j % 3 == 0;
            case 3: return (i + j) % 3 == 0;
            case 4: return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 == 0;
            case 5: return (i * j) % 2 + (i * j) % 3 == 0;
            case 6: return ((i * j) % 2 + (i * j) % 3) % 2 == 0;
            case 7: return ((i * j) % 3 + (i + j) % 2) % 2 == 0;
            default: throw new Error("bad maskPattern:" + maskPattern);
          }
        },
        getErrorCorrectionPolynomial: function(errorCorrectionLength) {
          var a = new QRPolynomial([1], 0);
          for (var i = 0; i < errorCorrectionLength; i++) {
            a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0));
          }
          return a;
        },
        getLengthInBits: function(mode, type) {
          if (1 <= type && type < 10) {
            switch (mode) {
              case 1: return 10;
              case 2: return 9;
              case 4: return 8;
              case 8: return 8;
              default: throw new Error("mode:" + mode);
            }
          }
          return 8;
        },
        getLostPoint: function(qrCode) {
          var moduleCount = qrCode.getModuleCount();
          var lostPoint = 0;
          for (var row = 0; row < moduleCount; row++) {
            for (var col = 0; col < moduleCount; col++) {
              var sameCount = 0, dark = qrCode.isDark(row, col);
              for (var r = -1; r <= 1; r++) {
                if (row + r < 0 || moduleCount <= row + r) continue;
                for (var c = -1; c <= 1; c++) {
                  if (col + c < 0 || moduleCount <= col + c) continue;
                  if (r == 0 && c == 0) continue;
                  if (dark == qrCode.isDark(row + r, col + c)) sameCount++;
                }
              }
              if (sameCount > 5) lostPoint += (3 + sameCount - 5);
            }
          }
          return lostPoint;
        }
      };

      function QRBitBuffer() {
        this.buffer = [];
        this.length = 0;
      }
      QRBitBuffer.prototype = {
        get: function(index) {
          var bufIndex = Math.floor(index / 8);
          return ((this.buffer[bufIndex] >>> (7 - index % 8)) & 1) == 1;
        },
        put: function(num, length) {
          for (var i = 0; i < length; i++) {
            this.putBit(((num >>> (length - i - 1)) & 1) == 1);
          }
        },
        getLengthInBits: function() { return this.length; },
        putBit: function(bit) {
          var bufIndex = Math.floor(this.length / 8);
          if (this.buffer.length <= bufIndex) this.buffer.push(0);
          if (bit) this.buffer[bufIndex] |= (0x80 >>> (this.length % 8));
          this.length++;
        }
      };

      var QRPolynomial = function(num, shift) {
        if (num.length == undefined) throw new Error(num.length + "/" + shift);
        var offset = 0;
        while (offset < num.length && num[offset] == 0) offset++;
        this.num = new Array(num.length - offset + shift);
        for (var i = 0; i < num.length - offset; i++) this.num[i] = num[i + offset];
      };
      QRPolynomial.prototype = {
        get: function(index) { return this.num[index]; },
        getLength: function() { return this.num.length; },
        multiply: function(e) {
          var num = new Array(this.getLength() + e.getLength() - 1);
          for (var i = 0; i < num.length; i++) num[i] = 0;
          for (var i = 0; i < this.getLength(); i++) {
            for (var j = 0; j < e.getLength(); j++) {
              num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i)) + QRMath.glog(e.get(j)));
            }
          }
          return new QRPolynomial(num, 0);
        },
        mod: function(e) {
          if (this.getLength() - e.getLength() < 0) return this;
          var ratio = QRMath.glog(this.get(0)) - QRMath.glog(e.get(0));
          if (ratio < 0) ratio += 255;
          var num = new Array(this.getLength());
          for (var i = 0; i < this.getLength(); i++) num[i] = this.get(i);
          for (var i = 0; i < e.getLength(); i++) {
            num[i] ^= QRMath.gexp(QRMath.glog(e.get(i)) + ratio);
          }
          return new QRPolynomial(num, 0).mod(e);
        }
      };

      var QRMath = {
        glog: function(n) {
          if (n < 1) throw new Error("glog(" + n + ")");
          return QRMath.LOG_TABLE[n];
        },
        gexp: function(n) {
          while (n < 0) n += 255;
          while (n >= 255) n -= 255;
          return QRMath.EXP_TABLE[n];
        },
        EXP_TABLE: new Array(256),
        LOG_TABLE: new Array(256)
      };
      for (var i = 0; i < 8; i++) QRMath.EXP_TABLE[i] = 1 << i;
      for (var i = 8; i < 256; i++) QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 1] ^ QRMath.EXP_TABLE[i - 2] ^ QRMath.EXP_TABLE[i - 4] ^ QRMath.EXP_TABLE[i - 8];
      for (var i = 0; i < 255; i++) QRMath.LOG_TABLE[QRMath.EXP_TABLE[i]] = i;

      var QRRSBlock = function(totalCount, dataCount) {
        this.totalCount = totalCount;
        this.dataCount = dataCount;
      };
      QRRSBlock.RS_BLOCK_TABLE = [
        [1, 26, 19], [1, 26, 16], [1, 26, 13], [1, 26, 9],
        [1, 44, 34], [1, 44, 28], [1, 44, 22], [1, 44, 16],
        [1, 70, 55], [1, 70, 44], [2, 35, 17], [2, 35, 13],
        [1, 100, 80], [2, 50, 32], [2, 50, 24], [4, 25, 9],
        [1, 134, 108], [2, 67, 43], [2, 33, 15], [2, 33, 11]
      ];
      QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectionLevel) {
        var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectionLevel);
        var length = rsBlock.length / 3;
        var list = [];
        for (var i = 0; i < length; i++) {
          var count = rsBlock[i * 3 + 0];
          var totalCount = rsBlock[i * 3 + 1];
          var dataCount = rsBlock[i * 3 + 2];
          for (var j = 0; j < count; j++) list.push(new QRRSBlock(totalCount, dataCount));
        }
        return list;
      };
      QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectionLevel) {
        switch (errorCorrectionLevel) {
          case 'L': return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
          case 'M': return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
          case 'Q': return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
          case 'H': return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
          default: return undefined;
        }
      };

      return function(typeNumber, errorCorrectionLevel) {
        return new QRCode(typeNumber, errorCorrectionLevel);
      };
    })();

    // Helper Generator Matriks & Data URL QR Code
    function generateQRCodeMatrix(text) {
      var cleanText = String(text || '0000000000').trim();
      var len = cleanText.length;
      var typeNumber = 1;
      if (len > 14 && len <= 26) typeNumber = 2;
      else if (len > 26 && len <= 42) typeNumber = 3;
      else if (len > 42) typeNumber = 4;

      var qr = qrcodeEngine(typeNumber, 'M');
      qr.addData(cleanText);
      qr.make();

      var count = qr.getModuleCount();
      var matrix = [];
      for (var r = 0; r < count; r++) {
        var row = [];
        for (var c = 0; c < count; c++) {
          row.push(qr.isDark(r, c));
        }
        matrix.push(row);
      }
      return matrix;
    }

    function generateQRCodeDataURL(text, size = 300) {
      const matrix = generateQRCodeMatrix(text);
      const count = matrix.length;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);

      const cellSize = size / count;
      ctx.fillStyle = '#0f172a';

      for (let r = 0; r < count; r++) {
        for (let c = 0; c < count; c++) {
          if (matrix[r][c]) {
            ctx.fillRect(c * cellSize, r * cellSize, cellSize + 0.3, cellSize + 0.3);
          }
        }
      }

      return canvas.toDataURL('image/png');
    }

    function playBeepSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch(e) {
        console.log('Audio API error:', e);
      }
    }

    function exportElementToPDF(elementId, filename = 'Laporan_SIMADRASAH.pdf') {
      const element = document.getElementById(elementId);
      if (!element) {
        window.print();
        return;
      }

      if (window.html2pdf) {
        const opt = {
          margin: [10, 10, 10, 10],
          filename: filename,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, logging: false },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        window.html2pdf().set(opt).from(element).save();
      } else {
        window.print();
      }
    }

    // Component Rendering 100% Valid Standard Pure JS QR Code Image
    function SimpleQRCodeImage({ value, size = 120 }) {
      const [qrDataUrl, setQrDataUrl] = useState('');

      useEffect(() => {
        if (value) {
          try {
            const url = generateQRCodeDataURL(String(value).trim(), size * 2);
            setQrDataUrl(url);
          } catch(err) {
            console.error('QR Render Err:', err);
          }
        }
      }, [value, size]);

      if (!qrDataUrl) {
        return <div style={{ width: size, height: size }} className="bg-slate-100 rounded-lg animate-pulse"></div>;
      }

      return (
        <img
          src={qrDataUrl}
          alt={`QR ${value}`}
          style={{ width: size, height: size }}
          className="bg-white p-1 rounded-lg border border-slate-200 object-contain shadow-xs"
        />
      );
    }

    // Generate High-Resolution Valid Standard 2000px x 2000px QR Code PNG File
    function generateHDQRCodeCanvas(student) {
      return new Promise((resolve) => {
        const nisnVal = String(student.nisn || '0000000000').trim();

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 2000;
        canvas.height = 2000;

        // Fill White Background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 2000, 2000);

        // Top Accent Bar
        ctx.fillStyle = '#047857';
        ctx.fillRect(0, 0, 2000, 40);

        // Render Pure QR Matrix
        const matrix = generateQRCodeMatrix(nisnVal);
        const count = matrix.length;
        const qrSize = 1450;
        const cellSize = qrSize / count;
        const startX = (2000 - qrSize) / 2;
        const startY = 160;

        // Outer Frame Border
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 12;
        ctx.strokeRect(startX - 20, startY - 20, qrSize + 40, qrSize + 40);

        // Fill Black Modules
        ctx.fillStyle = '#0f172a';
        for (let r = 0; r < count; r++) {
          for (let c = 0; c < count; c++) {
            if (matrix[r][c]) {
              ctx.fillRect(startX + c * cellSize, startY + r * cellSize, cellSize + 0.5, cellSize + 0.5);
            }
          }
        }

        // Footer Student Details
        ctx.textAlign = 'center';
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 58px sans-serif';
        ctx.fillText(student.name.toUpperCase(), 1000, 1750);

        ctx.fillStyle = '#047857';
        ctx.font = 'bold 44px monospace';
        ctx.fillText(`NISN: ${nisnVal}`, 1000, 1830);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 32px sans-serif';
        ctx.fillText('SIMADRASAH - Presensi QR Code Siswa', 1000, 1920);

        resolve(canvas.toDataURL('image/png'));
      });
    }

    function AbsensiQRModule({ students, attendanceLogs, setAttendanceLogs, onSync }) {
      const [cameraActive, setCameraActive] = useState(false);
      const [facingMode, setFacingMode] = useState('environment');
      const [scanStatusMsg, setScanStatusMsg] = useState('');
      const [manualNisn, setManualNisn] = useState('');
      const html5QrCodeRef = useRef(null);
      const isProcessingRef = useRef(false);

      const processAttendance = (student) => {
        if (isProcessingRef.current) return;
        isProcessingRef.current = true;

        const today = new Date().toISOString().split('T')[0];
        const nowTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        const newLog = {
          id: Date.now(),
          studentId: student.id,
          studentName: student.name,
          nisn: student.nisn,
          studentClass: student.class,
          date: today,
          time: nowTime,
          status: 'Hadir'
        };

        playBeepSound();
        setAttendanceLogs(prev => [newLog, ...prev]);
        setScanStatusMsg(`✅ PRESENSI BERHASIL: ${student.name} (Kelas ${student.class})`);
        
        setTimeout(() => {
          setScanStatusMsg('');
          isProcessingRef.current = false;
        }, 3000);

        if (onSync) onSync();
      };

      const handleScannedCode = (decodedText) => {
        if (isProcessingRef.current) return;
        const cleanText = String(decodedText).trim();
        const found = students.find(s => String(s.nisn).trim() === cleanText || cleanText.includes(String(s.nisn).trim()));
        if (found) {
          processAttendance(found);
        } else {
          isProcessingRef.current = true;
          setScanStatusMsg(`⚠️ Kode QR/NISN (${cleanText}) tidak terdaftar dalam database!`);
          setTimeout(() => {
            setScanStatusMsg('');
            isProcessingRef.current = false;
          }, 3000);
        }
      };

      useEffect(() => {
        let scanner = null;
        if (cameraActive) {
          scanner = new Html5Qrcode("reader");
          html5QrCodeRef.current = scanner;

          const qrboxFunction = (viewfinderWidth, viewfinderHeight) => {
            const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
            const boxSize = Math.floor(minEdge * 0.75);
            return { width: Math.max(180, boxSize), height: Math.max(180, boxSize) };
          };

          scanner.start(
            { facingMode: facingMode },
            {
              fps: 15,
              qrbox: qrboxFunction,
              experimentalFeatures: { useBarCodeDetectorIfSupported: true }
            },
            (decodedText) => {
              handleScannedCode(decodedText);
            },
            (error) => {}
          ).catch((err) => {
            console.error('Camera start error:', err);
            setScanStatusMsg('⚠️ Gagal membuka kamera. Pastikan memberikan izin kamera pada browser.');
            setCameraActive(false);
          });
        }

        return () => {
          if (scanner && scanner.isScanning) {
            scanner.stop().then(() => scanner.clear()).catch(err => console.error(err));
          }
        };
      }, [cameraActive, facingMode]);

      const handleManualSubmit = (e) => {
        e.preventDefault();
        if (!manualNisn) return;
        const found = students.find(s => String(s.nisn).trim() === String(manualNisn).trim());
        if (found) {
          processAttendance(found);
          setManualNisn('');
        } else {
          setScanStatusMsg(`⚠️ NISN (${manualNisn}) tidak terdaftar!`);
          setTimeout(() => setScanStatusMsg(''), 3000);
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-emerald-900 to-teal-900 rounded-3xl p-6 sm:p-8 text-white shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <div className="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold mb-3 border border-white/20">
                <Icon name="QrCode" size={14} /> Presensi QR Live Camera
              </div>
              <h2 className="text-2xl sm:text-3xl font-black">Pemindai QR Code Presensi Siswa</h2>
              <p className="text-emerald-100 text-xs sm:text-sm mt-1 max-w-xl">
                Arahkan kartu QR NISN siswa ke kamera. Sistem membaca otomatis & mencatat waktu kehadiran secara realtime.
              </p>
            </div>
          </div>

          {scanStatusMsg && (
            <div className={`p-4 rounded-2xl text-xs font-bold flex items-center gap-2 shadow-sm transition-all ${
              scanStatusMsg.includes('BERHASIL') ? 'bg-emerald-100 border border-emerald-300 text-emerald-900' : 'bg-amber-100 border border-amber-300 text-amber-900'
            }`}>
              <Icon name={scanStatusMsg.includes('BERHASIL') ? 'CheckCircle' : 'AlertCircle'} size={20} />
              <span className="text-sm">{scanStatusMsg}</span>
            </div>
          )}

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-xs space-y-4">
              <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 className="font-bold text-sm text-slate-800 flex items-center gap-2">
                  <Icon name="Camera" className="text-emerald-700" size={18} /> Kamera Pemindai
                </h3>
                {cameraActive && (
                  <button
                    type="button"
                    onClick={() => setFacingMode(facingMode === 'environment' ? 'user' : 'environment')}
                    className="text-[10px] font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-lg flex items-center gap-1 cursor-pointer"

                  </button>
                )}
              </div>

              <div className="bg-slate-900 rounded-2xl overflow-hidden min-h-[280px] flex flex-col items-center justify-center relative shadow-inner">
                {cameraActive ? (
                  <div id="reader" className="w-full h-full min-h-[280px]"></div>
                ) : (
                  <div className="p-8 text-center space-y-3">
                    <div className="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center text-emerald-400 mx-auto">
                      <Icon name="QrCode" size={36} />
                    </div>
                    <p className="text-xs text-slate-300 font-medium">Kamera Pemindai Belum Aktif</p>
                    <button
                      type="button"
                      onClick={() => setCameraActive(true)}
                      className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-2.5 rounded-xl text-xs shadow-md transition cursor-pointer inline-flex items-center gap-2"
                    >
                      <Icon name="Camera" size={16} /> Aktifkan Kamera Scanner
                    </button>
                  </div>
                )}
              </div>

              {cameraActive && (
                <button
                  type="button"

                </button>
              )}

              <div className="pt-2 border-t border-slate-100 space-y-2">
                <label className="block text-xs font-bold text-slate-600">Input Manual NISN</label>
                <form onSubmit={handleManualSubmit} className="flex gap-2">

                  />
                  <button type="submit" className="bg-emerald-800 text-white px-3 py-2 rounded-xl font-bold text-xs hover:bg-emerald-900 cursor-pointer">
                    Presensi
                  </button>
                </form>
              </div>
            </div>

            <div className="lg:col-span-2 bg-white rounded-3xl border border-slate-100 shadow-xs p-6 space-y-4">
              <div className="flex items-center justify-between border-b border-slate-100 pb-3">

                  <Icon name="Clock" className="text-emerald-700" size={18} /> Log Presensi Realtime
                </h3>
                <span className="text-xs font-bold text-emerald-800 bg-emerald-50 px-3 py-1 rounded-full">
                  {attendanceLogs.length} Records
                </span>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-50 text-[10px] font-bold text-slate-400 uppercase border-b border-slate-100">

    function PenilaianModule({ students, studentGrades, setStudentGrades, onSync }) {
      const [selectedClass, setSelectedClass] = useState('1');
      const [selectedSubject, setSelectedSubject] = useState(SUBJECT_LIST[0]);

      const filteredStudents = students.filter(s => String(s.class) === String(selectedClass));

      const getStudentGrade = (studentId) => {
        return studentGrades.find(g => String(g.studentId) === String(studentId) && g.subject === selectedSubject) || {
          studentId,
          subject: selectedSubject,
          uh: 80,
          tugas: 80,
          uts: 80,
          uas: 80
        };
      };

      const handleGradeChange = (studentId, field, val) => {
        const num = Math.min(100, Math.max(0, parseInt(val) || 0));
        const existingIndex = studentGrades.findIndex(g => String(g.studentId) === String(studentId) && g.subject === selectedSubject);

        if (existingIndex >= 0) {
          const updated = [...studentGrades];
          updated[existingIndex] = { ...updated[existingIndex], [field]: num };
          setStudentGrades(updated);
        } else {
          setStudentGrades([...studentGrades, { studentId, subject: selectedSubject, uh: 80, tugas: 80, uts: 80, uas: 80, [field]: num }]);
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-emerald-900 to-teal-900 rounded-3xl p-6 sm:p-8 text-white shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <div className="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold mb-3 border border-white/20">
                <Icon name="Award" size={14} /> Leger Penilaian Rapor Digital
              </div>
              <h2 className="text-2xl sm:text-3xl font-black">Penilaian & Leger Rapor</h2>
              <p className="text-emerald-100 text-xs sm:text-sm mt-1 max-w-xl">
                Olah nilai Ulangan Harian, Tugas, UTS, dan UAS secara otomatis dengan standar KKM 75.
              </p>
            </div>

            <button onClick={onSync} className="bg-white text-emerald-900 hover:bg-emerald-50 font-bold px-4 py-2.5 rounded-xl text-xs shadow-md cursor-pointer flex items-center gap-1.5">
              <Icon name="RefreshCw" size={14} /> Simpan & Sinkronkan
            </button>
          </div>

          <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs flex flex-wrap gap-3 items-center justify-between">
            <div className="flex gap-3">
              <select
                value={selectedClass}
                onChange={(e) => setSelectedClass(e.target.value)}
                className="px-3 py-2 border border-slate-200 rounded-xl text-xs font-bold bg-white outline-none"
              >
                {CLASS_LIST.map(c => <option key={c} value={c}>Kelas {c}</option>)}
              </select>

              <select
                value={selectedSubject}
                onChange={(e) => setSelectedSubject(e.target.value)}
                className="px-3 py-2 border border-slate-200 rounded-xl text-xs font-bold bg-white outline-none"
              >
                {SUBJECT_LIST.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-100 shadow-xs overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-100 text-[11px] font-bold text-slate-500 uppercase">
                    <th className="py-3 px-4">Nama Siswa</th>
                    <th className="py-3 px-4 text-center">UH (20%)</th>
                    <th className="py-3 px-4 text-center">Tugas (20%)</th>
                    <th className="py-3 px-4 text-center">UTS (30%)</th>
                    <th className="py-3 px-4 text-center">UAS (30%)</th>
                    <th className="py-3 px-4 text-center">Nilai Akhir</th>
                    <th className="py-3 px-4 text-center">Status KKM (75)</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 text-xs">
                  {filteredStudents.length === 0 ? (
                    <tr>
                      <td colSpan={7} className="py-8 text-center text-slate-400">Tidak ada siswa terdata pada kelas ini.</td>
                    </tr>
                  ) : (
                    filteredStudents.map((s) => {
                      const g = getStudentGrade(s.id);
                      const finalGrade = Math.round(g.uh * 0.2 + g.tugas * 0.2 + g.uts * 0.3 + g.uas * 0.3);
                      const isPassed = finalGrade >= 75;

                      return (
                        <tr key={s.id} className="hover:bg-slate-50 transition">
                          <td className="py-3 px-4 font-bold text-slate-800">
                            <p>{s.name}</p>
                            <p className="text-[10px] text-slate-400 font-mono">NISN: {s.nisn}</p>
                          </td>
                          <td className="py-3 px-4 text-center">
                            <input
                              type="number"
                              value={g.uh}
                              onChange={(e) => handleGradeChange(s.id, 'uh', e.target.value)}
                              className="w-16 p-1.5 border border-slate-200 rounded-lg text-center font-bold"
                            />
                          </td>
                          <td className="py-3 px-4 text-center">
                            <input
                              type="number"
                              value={g.tugas}
                              onChange={(e) => handleGradeChange(s.id, 'tugas', e.target.value)}
                              className="w-16 p-1.5 border border-slate-200 rounded-lg text-center font-bold"
                            />
                          </td>
                          <td className="py-3 px-4 text-center">
                            <input
                              type="number"
                              value={g.uts}
                              onChange={(e) => handleGradeChange(s.id, 'uts', e.target.value)}
                              className="w-16 p-1.5 border border-slate-200 rounded-lg text-center font-bold"
                            />
                          </td>
                          <td className="py-3 px-4 text-center">
                            <input
                              type="number"
                              value={g.uas}
                              onChange={(e) => handleGradeChange(s.id, 'uas', e.target.value)}
                              className="w-16 p-1.5 border border-slate-200 rounded-lg text-center font-bold"
                            />
                          </td>
                          <td className="py-3 px-4 text-center font-black text-sm text-emerald-900">
                            {finalGrade}
                          </td>
                          <td className="py-3 px-4 text-center">
                            <span className={`font-bold px-2.5 py-0.5 rounded-full text-[10px] ${
                              isPassed ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'
                            }`}>
                              {isPassed ? 'Tuntas' : 'Remidial'}
                            </span>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

                code,

                sanctionSuggestion

                    <input
                      type="text"
                      placeholder="Kode (misal: P-06)"
                      value={masterFormData.code}
                      onChange={(e) => setMasterFormData({ ...masterFormData, code: e.target.value })}
                      className="p-2 border border-slate-200 rounded-xl font-mono"
                      required
                    />
                    <input
                      type="number"
                      placeholder="Poin"
                      value={masterFormData.points}
                      onChange={(e) => setMasterFormData({ ...masterFormData, points: parseInt(e.target.value) || 0 })}
                      className="p-2 border border-slate-200 rounded-xl"
                      required
                    />
                  </div>
                  <input
                    type="text"
                    placeholder="Nama Pelanggaran"
                    value={masterFormData.name}
                    onChange={(e) => setMasterFormData({ ...masterFormData, name: e.target.value })}
                    className="w-full p-2 border border-slate-200 rounded-xl"
                    required
                  />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsMasterModalOpen(false)} className="px-4 py-2 bg-slate-100 rounded-xl font-bold">

                    </button>
                    <button type="submit" className="px-4 py-2 bg-slate-800 text-white rounded-xl font-bold cursor-pointer">
                      Simpan Aturan
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Import Master Violations */}
          {isImportMasterOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-lg rounded-3xl shadow-2xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-base text-slate-800 flex items-center gap-2">
                    <Icon name="Upload" className="text-emerald-700" size={20} /> Import Massal Master Pelanggaran
                  </h3>
                  <button onClick={() => setIsImportMasterOpen(false)} className="text-slate-400 hover:text-slate-600 p-1">
                    <Icon name="X" size={20} />
                  </button>
                </div>

                <p className="text-xs text-slate-500">
                  Tempelkan (*paste*) teks CSV/Excel dengan urutan kolom:
                  <br />
                  <code className="bg-slate-100 font-mono px-1.5 py-0.5 rounded text-[11px] text-slate-800">
                    Kode, Nama Pelanggaran, Kategori, Poin, Saran Sanksi
                  </code>
                </p>

                <textarea
                  value={pasteMasterData}
                  onChange={(e) => setPasteMasterData(e.target.value)}
                  rows={6}
                  placeholder="P-06,Merokok di Sekolah,Berat,50,Panggilan Ortu & SP-1"
                  className="w-full p-3 border border-slate-200 rounded-2xl text-xs font-mono outline-none resize-none"
                ></textarea>

                <div className="flex justify-end gap-2">
                  <button type="button" onClick={() => setIsImportMasterOpen(false)} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold">
                    Batal
                  </button>
                  <button type="button" onClick={handleImportMasterPasteData} className="px-5 py-2 bg-emerald-800 text-white rounded-xl font-bold hover:bg-emerald-900 shadow-md cursor-pointer">
                    Proses Import Master
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function RekapModule({ students, attendanceLogs, journals, studentGrades, violationLogs, currentUser, madrasahInfo }) {
      const [rekapType, setRekapType] = useState('absensi');
      const [periodFilter, setPeriodFilter] = useState('semua');
      const [selectedClassFilter, setSelectedClassFilter] = useState('Semua');
      const [customDate, setCustomDate] = useState(new Date().toISOString().split('T')[0]);

      const isDateInPeriod = (dateStr) => {
        if (!dateStr || periodFilter === 'semua') return true;
        const targetDate = new Date(dateStr);
        const refDate = new Date(customDate);

        if (periodFilter === 'harian') {
          return targetDate.toISOString().split('T')[0] === refDate.toISOString().split('T')[0];
        } else if (periodFilter === 'mingguan') {
          const diffTime = Math.abs(refDate - targetDate);
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
          return diffDays <= 7;
        } else if (periodFilter === 'bulanan') {
          return targetDate.getMonth() === refDate.getMonth() && targetDate.getFullYear() === refDate.getFullYear();
        }
        return true;
      };

      const filteredAttendance = useMemo(() => {
        return attendanceLogs.filter(a => {
          const matchClass = selectedClassFilter === 'Semua' || String(a.studentClass) === String(selectedClassFilter);
          const matchPeriod = isDateInPeriod(a.date);
          return matchClass && matchPeriod;
        });
      }, [attendanceLogs, selectedClassFilter, periodFilter, customDate]);

      const filteredJournals = useMemo(() => {
        return journals.filter(j => {
          const matchClass = selectedClassFilter === 'Semua' || String(j.className) === String(selectedClassFilter);
          const matchPeriod = isDateInPeriod(j.date);
          return matchClass && matchPeriod;
        });
      }, [journals, selectedClassFilter, periodFilter, customDate]);

      const filteredViolations = useMemo(() => {
        return violationLogs.filter(v => {
          const matchClass = selectedClassFilter === 'Semua' || String(v.studentClass) === String(selectedClassFilter);
          const matchPeriod = isDateInPeriod(v.date);
          return matchClass && matchPeriod;
        });
      }, [violationLogs, selectedClassFilter, periodFilter, customDate]);

      const filteredStudents = useMemo(() => {
        return selectedClassFilter === 'Semua' ? students : students.filter(s => String(s.class) === String(selectedClassFilter));
      }, [students, selectedClassFilter]);

      const exportToCSV = () => {
        let filename = `Rekap_${rekapType}_${periodFilter}_${new Date().toISOString().split('T')[0]}.csv`;
        let csvContent = "";

        if (rekapType === 'absensi') {
          csvContent = "No,Tanggal,Waktu,Nama Siswa,NISN,Kelas,Status Presensi\n";
          filteredAttendance.forEach((item, idx) => {
            csvContent += `${idx + 1},"${item.date}","${item.time}","${item.studentName}","${item.nisn}","Kelas ${item.studentClass}","${item.status}"\n`;
          });
        } else if (rekapType === 'jurnal') {
          csvContent = "No,Tanggal,Jam Ke,Kelas,Mata Pelajaran,Topik / Pembahasan,Pengajar,Catatan\n";
          filteredJournals.forEach((item, idx) => {
            csvContent += `${idx + 1},"${item.date}","${item.timeSlot}","Kelas ${item.className}","${item.subject}","${item.topic}","${item.teacher}","${item.notes || '-'}"\n`;
          });
        } else if (rekapType === 'penilaian') {
          csvContent = "No,Nama Siswa,NISN,Kelas,UH (20%),Tugas (20%),UTS (30%),UAS (30%),Nilai Akhir,Status\n";
          filteredStudents.forEach((st, idx) => {
            const g = studentGrades.find(gr => String(gr.studentId) === String(st.id)) || { uh: 80, tugas: 80, uts: 80, uas: 80 };
            const finalG = Math.round(g.uh * 0.2 + g.tugas * 0.2 + g.uts * 0.3 + g.uas * 0.3);
            csvContent += `${idx + 1},"${st.name}","${st.nisn}","Kelas ${st.class}",${g.uh},${g.tugas},${g.uts},${g.uas},${finalG},"${finalG >= 75 ? 'Tuntas' : 'Remidial'}"\n`;
          });
        } else if (rekapType === 'pelanggaran') {
          csvContent = "No,Tanggal,Nama Siswa,NISN,Kelas,Nama Pelanggaran,Kategori,Poin,Pelapor,Catatan\n";
          filteredViolations.forEach((item, idx) => {
            csvContent += `${idx + 1},"${item.date}","${item.studentName}","${item.nisn}","Kelas ${item.studentClass}","${item.violationName}","${item.category}",${item.points},"${item.reporter}","${item.notes || '-'}"\n`;
          });
        }

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
      };

      const handleDownloadPDF = () => {
        const filename = `Laporan_${rekapType.toUpperCase()}_${madrasahInfo.name.replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.pdf`;
        exportElementToPDF('printable-report-area', filename);
      };

      const handlePrintPDF = () => {
        window.print();
      };

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-emerald-900 to-teal-900 text-white p-6 sm:p-8 rounded-3xl shadow-lg no-print flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <div className="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold mb-3 border border-white/20">
                <Icon name="FileText" size={14} /> Center Report SIMADRASAH
              </div>
              <h2 className="font-black text-2xl sm:text-3xl">Rekapitulasi & Cetak Laporan</h2>
              <p className="text-emerald-100 text-xs sm:text-sm mt-1 max-w-xl">
                Unduh berkas PDF resmi atau ekspor data ke Excel (CSV) untuk Absensi, Jurnal KBM, Nilai Rapor, dan Catatan BK.
              </p>
            </div>
            <div className="flex flex-wrap gap-2">
              <button
                type="button"
                onClick={exportToCSV}
                className="bg-emerald-800 hover:bg-emerald-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs flex items-center gap-1.5 cursor-pointer border border-emerald-700 shadow-xs"
              >
                <Icon name="FileSpreadsheet" size={16} /> Excel (CSV)
              </button>
              <button
                type="button"
                onClick={handleDownloadPDF}
                className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2.5 rounded-xl text-xs shadow-md transition flex items-center gap-1.5 cursor-pointer"
              >
                <Icon name="Download" size={16} /> Unduh PDF File
              </button>
              <button
                type="button"
                onClick={handlePrintPDF}
                className="bg-white text-emerald-900 hover:bg-emerald-50 font-bold px-4 py-2.5 rounded-xl text-xs shadow-md transition flex items-center gap-1.5 cursor-pointer"
              >
                <Icon name="Printer" size={16} /> Cetak (Printer)
              </button>
            </div>
          </div>

          <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs space-y-3 no-print">
            <div className="flex bg-slate-100 p-1 rounded-xl text-xs font-bold">
              <button
                onClick={() => setRekapType('absensi')}
                className={`flex-1 py-2 rounded-lg transition cursor-pointer flex items-center justify-center gap-1.5 ${rekapType === 'absensi' ? 'bg-white text-emerald-800 shadow-xs' : 'text-slate-500'}`}
              >
                <Icon name="QrCode" size={14} /> Presensi QR
              </button>
              <button
                onClick={() => setRekapType('jurnal')}
                className={`flex-1 py-2 rounded-lg transition cursor-pointer flex items-center justify-center gap-1.5 ${rekapType === 'jurnal' ? 'bg-white text-emerald-800 shadow-xs' : 'text-slate-500'}`}
              >
                <Icon name="BookOpen" size={14} /> Jurnal KBM
              </button>
              <button
                onClick={() => setRekapType('penilaian')}
                className={`flex-1 py-2 rounded-lg transition cursor-pointer flex items-center justify-center gap-1.5 ${rekapType === 'penilaian' ? 'bg-white text-emerald-800 shadow-xs' : 'text-slate-500'}`}
              >
                <Icon name="Award" size={14} /> Penilaian Rapor
              </button>
              <button
                onClick={() => setRekapType('pelanggaran')}
                className={`flex-1 py-2 rounded-lg transition cursor-pointer flex items-center justify-center gap-1.5 ${rekapType === 'pelanggaran' ? 'bg-white text-rose-800 shadow-xs' : 'text-slate-500'}`}
              >
                <Icon name="AlertTriangle" size={14} /> Pelanggaran BK
              </button>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
              <div>
                <label className="block font-bold text-slate-500 mb-1">Periode Rekap</label>
                <select
                  value={periodFilter}
                  onChange={(e) => setPeriodFilter(e.target.value)}
                  className="w-full p-2.5 border border-slate-200 rounded-xl font-bold bg-white outline-none"
                >
                  <option value="semua">Semua Periode</option>
                  <option value="harian">Rekap Harian</option>
                  <option value="mingguan">Rekap Mingguan (7 Hari Terakhir)</option>
                  <option value="bulanan">Rekap Bulanan</option>
                </select>
              </div>

              {periodFilter !== 'semua' && (
                <div>
                  <label className="block font-bold text-slate-500 mb-1">Pilih Tanggal Acuan</label>
                  <input
                    type="date"
                    value={customDate}
                    onChange={(e) => setCustomDate(e.target.value)}
                    className="w-full p-2.5 border border-slate-200 rounded-xl outline-none font-bold text-slate-700"
                  />
                </div>
              )}

              <div>
                <label className="block font-bold text-slate-500 mb-1">Filter Kelas Target</label>
                <select
                  value={selectedClassFilter}
                  onChange={(e) => setSelectedClassFilter(e.target.value)}
                  className="w-full p-2.5 border border-slate-200 rounded-xl font-bold bg-white outline-none"
                >
                  <option value="Semua">Semua Kelas (1 - 6)</option>
                  {CLASS_LIST.map(c => <option key={c} value={c}>Kelas {c}</option>)}
                </select>
              </div>
            </div>
          </div>

          <div id="printable-report-area" className="bg-white rounded-3xl border border-slate-200 p-6 sm:p-10 shadow-sm print-area space-y-6">
            <div className="border-b-4 border-double border-slate-800 pb-4 text-center relative flex items-center justify-between gap-4">
              <div className="w-20 h-20 shrink-0 flex items-center justify-center">
                {madrasahInfo.logoUrl ? (
                  <img src={madrasahInfo.logoUrl} alt="Logo Kop" className="max-h-20 max-w-20 object-contain" />
                ) : (
                  <div className="w-16 h-16 bg-emerald-900 text-white rounded-2xl flex items-center justify-center font-black text-2xl border border-emerald-700 shadow-sm">
                    M
                  </div>
                )}
              </div>
              <div className="flex-1 text-center">
                <h1 className="text-xl sm:text-2xl font-black tracking-wide text-slate-900 uppercase">{madrasahInfo.name}</h1>
                <p className="text-xs font-semibold text-slate-600 uppercase">{madrasahInfo.subTitle}</p>
                <p className="text-[10px] text-slate-500 mt-0.5">{madrasahInfo.address} | Telp: {madrasahInfo.phone}</p>
                <p className="text-[10px] text-emerald-800 font-mono">Website / Email: {madrasahInfo.website}</p>
              </div>
              <div className="w-20 h-20 shrink-0 hidden sm:block"></div>
            </div>

            <div className="text-center space-y-1">
              <h2 className="text-base font-black uppercase text-slate-800 underline tracking-wider">
                LAPORAN REKAPITULASI {rekapType.toUpperCase()}
              </h2>
              <p className="text-xs font-bold text-emerald-800">
                Filter Kelas: {selectedClassFilter === 'Semua' ? 'Semua Kelas (1 s/d 6)' : `Kelas ${selectedClassFilter}`} | Periode: {periodFilter.toUpperCase()}
              </p>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-center text-xs">
              <div className="p-3 bg-slate-50 border border-slate-200 rounded-2xl">
                <p className="text-[10px] font-bold text-slate-400 uppercase">Total Log Presensi</p>
                <p className="text-lg font-black text-emerald-800">{filteredAttendance.length} Records</p>
              </div>
              <div className="p-3 bg-slate-50 border border-slate-200 rounded-2xl">
                <p className="text-[10px] font-bold text-slate-400 uppercase">Total Jurnal KBM</p>
                <p className="text-lg font-black text-emerald-800">{filteredJournals.length} Pertemuan</p>
              </div>
              <div className="p-3 bg-slate-50 border border-slate-200 rounded-2xl">
                <p className="text-[10px] font-bold text-slate-400 uppercase">Total Siswa Terdata</p>
                <p className="text-lg font-black text-slate-800">{filteredStudents.length} Siswa</p>
              </div>
              <div className="p-3 bg-slate-50 border border-slate-200 rounded-2xl">
                <p className="text-[10px] font-bold text-slate-400 uppercase">Log Pelanggaran</p>
                <p className="text-lg font-black text-rose-800">{filteredViolations.length} Insiden</p>
              </div>
            </div>

            {rekapType === 'absensi' && (
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse border border-slate-300">
                  <thead>
                    <tr className="bg-slate-100 text-slate-700 font-bold border-b border-slate-300">
                      <th className="p-2 border border-slate-300 text-center">No</th>
                      <th className="p-2 border border-slate-300">Tanggal</th>
                      <th className="p-2 border border-slate-300">Waktu</th>
                      <th className="p-2 border border-slate-300">Nama Siswa</th>
                      <th className="p-2 border border-slate-300">NISN</th>
                      <th className="p-2 border border-slate-300">Kelas</th>
                      <th className="p-2 border border-slate-300 text-center">Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredAttendance.length === 0 ? (
                      <tr>
                        <td colSpan={7} className="p-6 text-center text-slate-400">Tidak ada data presensi pada kriteria filter ini.</td>
                      </tr>
                    ) : (
                      filteredAttendance.map((item, idx) => (
                        <tr key={item.id} className="border-b border-slate-200">
                          <td className="p-2 border border-slate-300 text-center font-bold">{idx + 1}</td>
                          <td className="p-2 border border-slate-300 font-bold text-slate-700">{item.date}</td>
                          <td className="p-2 border border-slate-300 font-mono">{item.time}</td>
                          <td className="p-2 border border-slate-300 font-bold">{item.studentName}</td>
                          <td className="p-2 border border-slate-300 font-mono">{item.nisn}</td>
                          <td className="p-2 border border-slate-300 font-bold text-emerald-800">Kelas {item.studentClass}</td>
                          <td className="p-2 border border-slate-300 text-center font-bold text-emerald-800">{item.status}</td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            )}

            {rekapType === 'jurnal' && (
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse border border-slate-300">
                  <thead>
                    <tr className="bg-slate-100 text-slate-700 font-bold border-b border-slate-300">
                      <th className="p-2 border border-slate-300 text-center">No</th>
                      <th className="p-2 border border-slate-300">Tanggal & Jam</th>
                      <th className="p-2 border border-slate-300">Kelas & Mapel</th>
                      <th className="p-2 border border-slate-300">Materi Pembahasan</th>
                      <th className="p-2 border border-slate-300">Pengajar</th>
                      <th className="p-2 border border-slate-300">Catatan</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredJournals.length === 0 ? (
                      <tr>
                        <td colSpan={6} className="p-6 text-center text-slate-400">Tidak ada data jurnal mengajar pada kriteria filter ini.</td>
                      </tr>
                    ) : (
                      filteredJournals.map((item, idx) => (
                        <tr key={item.id} className="border-b border-slate-200">
                          <td className="p-2 border border-slate-300 text-center font-bold">{idx + 1}</td>
                          <td className="p-2 border border-slate-300 font-bold">{item.date}<br/><span className="text-[10px] text-emerald-800">{item.timeSlot}</span></td>
                          <td className="p-2 border border-slate-300 font-bold">Kelas {item.className}<br/><span className="font-normal text-slate-600">{item.subject}</span></td>
                          <td className="p-2 border border-slate-300 font-bold text-slate-800">{item.topic}</td>
                          <td className="p-2 border border-slate-300">{item.teacher}</td>
                          <td className="p-2 border border-slate-300 text-[10px] text-slate-500">{item.notes || '-'}</td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            )}

            {rekapType === 'penilaian' && (
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse border border-slate-300">
                  <thead>
                    <tr className="bg-slate-100 text-slate-700 font-bold border-b border-slate-300">
                      <th className="p-2 border border-slate-300 text-center">No</th>
                      <th className="p-2 border border-slate-300">Nama Siswa & NISN</th>
                      <th className="p-2 border border-slate-300 text-center">Kelas</th>
                      <th className="p-2 border border-slate-300 text-center">UH</th>
                      <th className="p-2 border border-slate-300 text-center">Tugas</th>

                      <th className="p-2 border border-slate-300 text-center">Status</th>
                    </tr>
                  </thead>

                    {filteredStudents.length === 0 ? (

                        <td colSpan={9} className="p-6 text-center text-slate-400">Tidak ada data siswa untuk leger penilaian.</td>
                      </tr>
                    ) : (
                      filteredStudents.map((st, idx) => {
                        const g = studentGrades.find(gr => String(gr.studentId) === String(st.id)) || { uh: 80, tugas: 80, uts: 80, uas: 80 };
                        const finalG = Math.round(g.uh * 0.2 + g.tugas * 0.2 + g.uts * 0.3 + g.uas * 0.3);
                        return (
                          <tr key={st.id} className="border-b border-slate-200">
