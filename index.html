    function generateHDQRCodeCanvas(student, format = 'qr_only') {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 2000;
        canvas.height = 2000;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 2000, 2000);

        ctx.fillStyle = '#047857';
        ctx.fillRect(0, 0, 2000, 40);

        const qrSize = 1450;
        const startX = (2000 - qrSize) / 2;
        const startY = 160;

        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 12;
        ctx.strokeRect(startX - 20, startY - 20, qrSize + 40, qrSize + 40);

        const str = String(student.nisn || '0000000000');
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = (hash << 5) - hash + str.charCodeAt(i);
          hash |= 0;
        }

        const gridSize = 21;
        const cellSize = qrSize / gridSize;
        ctx.fillStyle = '#0f172a';

        for (let r = 0; r < gridSize; r++) {
          for (let c = 0; c < gridSize; c++) {
            const isCornerTL = r < 5 && c < 5;
            const isCornerTR = r < 5 && c >= gridSize - 5;
            const isCornerBL = r >= gridSize - 5 && c < 5;

            if (isCornerTL || isCornerTR || isCornerBL) {
              const isBorder = r === 0 || r === 4 || c === 0 || c === 4 ||
                               r === gridSize - 1 || r === gridSize - 5 ||
                               c === gridSize - 1 || c === gridSize - 5;
              const isCenter = (r >= 1 && r <= 3) && (c >= 1 && c <= 3) ||
                               (r >= 1 && r <= 3) && (c >= gridSize - 4 && c <= gridSize - 2) ||
                               (r >= gridSize - 4 && r <= gridSize - 2) && (c >= 1 && c <= 3);
              if (isBorder || isCenter) {
                ctx.fillRect(startX + c * cellSize, startY + r * cellSize, cellSize - 1, cellSize - 1);
              }
            } else {
              const seed = Math.sin(hash + r * gridSize + c) * 10000;
              if ((seed - Math.floor(seed)) > 0.45) {
                ctx.fillRect(startX + c * cellSize, startY + r * cellSize, cellSize - 1, cellSize - 1);
              }
            }
          }
        }

        ctx.textAlign = 'center';
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 58px sans-serif';
        ctx.fillText(student.name.toUpperCase(), 1000, 1750);

        ctx.fillStyle = '#047857';
        ctx.font = 'bold 44px monospace';
        ctx.fillText(`NISN: ${student.nisn}`, 1000, 1830);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 32px sans-serif';
        ctx.fillText('SIMADRASAH - Presensi QR Code Siswa', 1000, 1920);

        resolve(canvas.toDataURL('image/png'));
      });
    }

    function AbsensiQRModule({ students, attendanceLogs, setAttendanceLogs, onSync }) {
      const [isCameraActive, setIsCameraActive] = useState(false);
      const [scanStatusMsg, setScanStatusMsg] = useState(null);
      const [cameraError, setCameraError] = useState('');
      const [manualNisn, setManualNisn] = useState('');
      const [facingMode, setFacingMode] = useState('environment');
      const html5QrCodeRef = useRef(null);

      const playBeep = () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        } catch (e) {
          console.log('Audio error:', e);
        }
      };

      const processAttendance = (nisnValue) => {
        const cleanNisn = String(nisnValue).trim();
        const student = students.find(s => String(s.nisn).trim() === cleanNisn);

        const today = new Date().toISOString().split('T')[0];
        const nowTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        if (student) {
          const newLog = {
            id: Date.now(),
            studentId: student.id,
            studentName: student.name,
            nisn: student.nisn,
            studentClass: student.class,
            date: today,
            time: nowTime,
            status: 'Hadir'
          };

          setAttendanceLogs(prev => [newLog, ...prev]);
          playBeep();
          setScanStatusMsg({
            type: 'success',
            text: `✅ PRESENSI BERHASIL! ${student.name} (${student.class}) - NISN: ${student.nisn}`
          });
          if (onSync) onSync();
        } else {
          playBeep();
          setScanStatusMsg({
            type: 'warning',
            text: `⚠️ NISN (${cleanNisn}) terdeteksi, namun TIDAK DITEMUKAN dalam data siswa.`
          });
        }

        setTimeout(() => setScanStatusMsg(null), 5000);
      };

      const startScanner = () => {
        setCameraError('');
        setIsCameraActive(true);
      };

      const stopScanner = async () => {
        if (html5QrCodeRef.current) {
          try {
            if (html5QrCodeRef.current.isScanning) {
              await html5QrCodeRef.current.stop();
            }
            html5QrCodeRef.current.clear();
          } catch (err) {
            console.error("Error stop scanner:", err);
          }
          html5QrCodeRef.current = null;
        }
        setIsCameraActive(false);
      };

      useEffect(() => {
        let qrScanner = null;

        if (isCameraActive) {
          const timer = setTimeout(() => {
            if (!window.Html5Qrcode) {
              setCameraError('Pustaka Html5Qrcode belum siap. Pastikan terhubung ke internet.');
              setIsCameraActive(false);
              return;
            }

            try {
              qrScanner = new window.Html5Qrcode("reader");
              html5QrCodeRef.current = qrScanner;

              const config = {
                fps: 10,
                qrbox: { width: 220, height: 220 },
                aspectRatio: 1.0
              };

              qrScanner.start(
                { facingMode: facingMode },
                config,
                (decodedText) => {
                  processAttendance(decodedText);
                },
                () => {}
              ).catch((err) => {
                console.error("Kamera error:", err);
                setCameraError(`Gagal membuka kamera: ${err.message || err}. Berikan izin akses kamera pada browser HP Anda.`);
                setIsCameraActive(false);
              });
            } catch (err) {
              setCameraError(`Error: ${err.message || err}`);
              setIsCameraActive(false);
            }
          }, 300);

          return () => {
            clearTimeout(timer);
            if (qrScanner && qrScanner.isScanning) {
              qrScanner.stop().then(() => qrScanner.clear()).catch(console.error);
            }
          };
        }
      }, [isCameraActive, facingMode]);

      const toggleFacingMode = () => {
        const newMode = facingMode === 'environment' ? 'user' : 'environment';
        setFacingMode(newMode);
        if (isCameraActive) {
          stopScanner().then(() => {
            setTimeout(() => startScanner(), 300);
          });
        }
      };

      const handleManualSubmit = (e) => {
        e.preventDefault();
        if (!manualNisn.trim()) return;
        processAttendance(manualNisn);
        setManualNisn('');
      };

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-emerald-800 to-teal-800 rounded-3xl p-6 sm:p-8 text-white shadow-lg relative overflow-hidden">

                  <th className="p-3 text-center">Tugas</th>
                  <th className="p-3 text-center">UTS</th>
                  <th className="p-3 text-center">UAS</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(s => (
                  <tr key={s.id} className="border-b">
                    <td className="p-3 font-bold">{s.name}<br/><span className="text-[10px] text-slate-400">NISN: {s.nisn}</span></td>
                    <td className="p-3 text-center font-bold">85</td>
                    <td className="p-3 text-center font-bold">90</td>
                    <td className="p-3 text-center font-bold">80</td>
                    <td className="p-3 text-center font-bold">88</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function PelanggaranModule({ students, masterViolations, violationLogs, setViolationLogs }) {
      return (
        <div className="space-y-6">
          <div className="bg-rose-900 text-white p-6 rounded-3xl">
            <h2 className="font-black text-2xl">Catatan Pelanggaran & BK</h2>
            <p className="text-xs text-rose-200 mt-1">Kedisiplinan Siswa Kelas 1 - 6</p>
          </div>
          <div className="bg-white rounded-2xl border border-slate-100 p-4">
            <table className="w-full text-left text-xs">
              <thead>
                <tr className="border-b font-bold text-slate-400">
                  <th className="p-2">Tanggal</th>
                  <th className="p-2">Siswa</th>
                  <th className="p-2">Pelanggaran</th>
                  <th className="p-2">Poin</th>
                </tr>
              </thead>
              <tbody>
                {violationLogs.map(v => (
                  <tr key={v.id} className="border-b">
                    <td className="p-2 font-bold">{v.date}</td>
                    <td className="p-2 font-bold">{v.studentName}<br/><span className="text-[10px] text-slate-400">Kelas {v.studentClass}</span></td>
                    <td className="p-2 text-rose-800 font-bold">{v.violationName}</td>
                    <td className="p-2 font-bold text-rose-700">+{v.points} Pts</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
