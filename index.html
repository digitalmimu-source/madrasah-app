    function SimpleQRCodeSVG({ value, size = 120 }) {
      const str = String(value || '');
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }

      const gridSize = 15;
      const cells = [];
      
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const isCornerTL = r < 4 && c < 4;
          const isCornerTR = r < 4 && c >= gridSize - 4;
          const isCornerBL = r >= gridSize - 4 && c < 4;

          if (isCornerTL || isCornerTR || isCornerBL) {
            const isBorder = r === 0 || r === 3 || c === 0 || c === 3 ||
                             r === gridSize - 1 || r === gridSize - 4 ||
                             c === gridSize - 1 || c === gridSize - 4;
            const isCenter = (r === 1 || r === 2) && (c === 1 || c === 2) ||
                             (r === 1 || r === 2) && (c === gridSize - 3 || c === gridSize - 2) ||
                             (r === gridSize - 3 || r === gridSize - 2) && (c === 1 || c === 2);
            if (isBorder || isCenter) cells.push({ r, c });
          } else {
            const seed = Math.sin(hash + r * gridSize + c) * 10000;
            if ((seed - Math.floor(seed)) > 0.48) {
              cells.push({ r, c });
            }
          }
        }
      }

      const cellSize = size / gridSize;

      return (
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="bg-white p-1.5 rounded-lg border border-slate-200">
          {cells.map((cell, idx) => (
            <rect
              key={idx}
              x={cell.c * cellSize}
              y={cell.r * cellSize}
              width={cellSize - 0.2}
              height={cellSize - 0.2}
              fill="#0f172a"
              rx={0.5}
            />
          ))}
        </svg>
      );
    }

    function generateHDQRCodeCanvas(student) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 2000;
        canvas.height = 2000;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 2000, 2000);

        ctx.fillStyle = '#065f46';
        ctx.fillRect(0, 0, 2000, 30);

        const qrSize = 1450;
        const startX = (2000 - qrSize) / 2;
        const startY = 160;

        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 12;
        ctx.strokeRect(startX - 20, startY - 20, qrSize + 40, qrSize + 40);

        const str = String(student.nisn || '0000000000');
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = (hash << 5) - hash + str.charCodeAt(i);
          hash |= 0;
        }

        const gridSize = 21;
        const cellSize = qrSize / gridSize;

        ctx.fillStyle = '#0f172a';

        for (let r = 0; r < gridSize; r++) {
          for (let c = 0; c < gridSize; c++) {
            const isCornerTL = r < 5 && c < 5;
            const isCornerTR = r < 5 && c >= gridSize - 5;
            const isCornerBL = r >= gridSize - 5 && c < 5;

            if (isCornerTL || isCornerTR || isCornerBL) {
              const isBorder = r === 0 || r === 4 || c === 0 || c === 4 ||
                               r === gridSize - 1 || r === gridSize - 5 ||
                               c === gridSize - 1 || c === gridSize - 5;
              const isCenter = (r >= 1 && r <= 3) && (c >= 1 && c <= 3) ||
                               (r >= 1 && r <= 3) && (c >= gridSize - 4 && c <= gridSize - 2) ||
                               (r >= gridSize - 4 && r <= gridSize - 2) && (c >= 1 && c <= 3);
              if (isBorder || isCenter) {
                ctx.fillRect(startX + c * cellSize, startY + r * cellSize, cellSize - 1, cellSize - 1);
              }
            } else {
              const seed = Math.sin(hash + r * gridSize + c) * 10000;
              if ((seed - Math.floor(seed)) > 0.45) {
                ctx.fillRect(startX + c * cellSize, startY + r * cellSize, cellSize - 1, cellSize - 1);
              }
            }
          }
        }

        ctx.textAlign = 'center';
        
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 58px sans-serif';
        ctx.fillText(student.name.toUpperCase(), 1000, 1750);

        ctx.fillStyle = '#047857';
        ctx.font = 'bold 44px monospace';
        ctx.fillText(`NISN: ${student.nisn}`, 1000, 1830);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 32px sans-serif';
        ctx.fillText('SIMADRASAH - Presensi QR Code Siswa', 1000, 1920);

        resolve(canvas.toDataURL('image/png'));
      });
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error("App Catch Error Boundary:", error, errorInfo);
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-900 text-white flex items-center justify-center p-6">
              <div className="max-w-md w-full bg-slate-800 p-8 rounded-3xl border border-slate-700 space-y-4 text-center">
                <Icon name="AlertTriangle" size={48} className="text-amber-400 mx-auto" />
                <h2 className="text-xl font-bold">Terjadi Kesalahan Sistem</h2>
                <p className="text-xs text-slate-300 font-mono bg-slate-900/80 p-3 rounded-xl text-left overflow-x-auto">
                  {this.state.error?.toString() || 'Unknown runtime exception'}
                </p>
                <button
                  type="button"
                  onClick={() => {
                    localStorage.clear();
                    window.location.reload();
                  }}
                  className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-xs cursor-pointer transition"
                >
                  Reset Data & Reload Application
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

      useEffect(() => { localStorage.setItem('simadrasah_info', JSON.stringify(madrasahInfo)); }, [madrasahInfo]);

      useEffect(() => {
        const fetchInitialDataFromGAS = async () => {
          const activeUrl = spreadsheetUrl || DEFAULT_GAS_URL;
          if (!activeUrl) return;

          try {
            setIsSyncing(true);
            setSyncStatus('🔄 Terhubung ke Google Sheets, mengunduh data terbaru...');
            const response = await fetch(activeUrl);
            const json = await response.json();

            if (json && json.status === 'success' && json.data) {
              if (json.data.teachers && json.data.teachers.length > 0) setTeachers(json.data.teachers);
              if (json.data.students && json.data.students.length > 0) setStudents(json.data.students);

              if (json.data.masterViolations && json.data.masterViolations.length > 0) setMasterViolations(json.data.masterViolations);
              if (json.data.violationLogs && json.data.violationLogs.length > 0) setViolationLogs(json.data.violationLogs);

              if (json.data.studentGrades && json.data.studentGrades.length > 0) setStudentGrades(json.data.studentGrades);
              if (json.data.madrasahInfo) setMadrasahInfo(json.data.madrasahInfo);
              setSyncStatus('✅ Berhasil memuat data dari Google Sheets!');
            }
          } catch (err) {
            console.log('Automated GAS fetch status:', err);
            setSyncStatus('ℹ️ Menggunakan data lokal.');
          } finally {
            setIsSyncing(false);
            setTimeout(() => setSyncStatus(''), 5000);

        setCurrentUser(user);

      };

      const handleLogout = () => {

      const handleSyncDrive = async () => {
        if (!spreadsheetUrl) {
          setIsDbModalOpen(true);
          return;
        }
        setIsSyncing(true);
        setSyncStatus('Menghubungkan ke Google Apps Script API...');

        try {
          const payload = {
            action: 'sync_all',
            teachers,
            students,
            journals,
            masterViolations,
            violationLogs,
            attendanceLogs,
            studentGrades,
            madrasahInfo
          };

          await fetch(spreadsheetUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          setSyncStatus('✅ Berhasil menyinkronkan data ke Google Spreadsheets!');
        } catch (err) {
          console.error(err);
          setSyncStatus('⚠️ Gagal terhubung.');

          setIsSyncing(false);
          setTimeout(() => setSyncStatus(''), 4000);

                <div className="flex items-center gap-2">

                  }`}
                >
                  <Icon name="BookOpen" size={18} /> Jurnal KBM Mengajar
                </button>

                <button

                <button

            <main className="flex-1 min-w-0">

              {activeTab === 'jurnal' && <JurnalModule journals={journals} setJournals={setJournals} currentUser={currentUser} madrasahInfo={madrasahInfo} onSync={handleSyncDrive} />}
              {activeTab === 'absensi' && <AbsensiQRModule students={students} attendanceLogs={attendanceLogs} setAttendanceLogs={setAttendanceLogs} onSync={handleSyncDrive} />}
              {activeTab === 'siswa' && <SiswaModule students={students} setStudents={setStudents} onSync={handleSyncDrive} />}

              {activeTab === 'pelanggaran' && <PelanggaranModule students={students} masterViolations={masterViolations} setMasterViolations={setMasterViolations} violationLogs={violationLogs} setViolationLogs={setViolationLogs} onSync={handleSyncDrive} />}
              {activeTab === 'pengaturan' && <PengaturanModule madrasahInfo={madrasahInfo} setMadrasahInfo={setMadrasahInfo} students={students} setStudents={setStudents} teachers={teachers} setTeachers={setTeachers} spreadsheetUrl={spreadsheetUrl} setSpreadsheetUrl={setSpreadsheetUrl} onSync={handleSyncDrive} />}

    function LoginPage({ onLogin, teachers, madrasahInfo }) {
      const [role, setRole] = useState('guru');
      const [username, setUsername] = useState('guru1');
      const [password, setPassword] = useState('123456');
      const [errorMsg, setErrorMsg] = useState('');

      const handleQuickFill = (selectedRole) => {
        setRole(selectedRole);
        if (selectedRole === 'guru') {
          const g = teachers.find(t => t.role === 'guru') || { username: 'guru1', password: '123456' };
          setUsername(g.username);
          setPassword(g.password);
        } else {
          const a = teachers.find(t => t.role === 'admin') || { username: 'admin', password: 'admin123' };
          setUsername(a.username);
          setPassword(a.password);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!username || !password) {
          setErrorMsg('Harap isi username dan kata sandi.');
          return;
        }

        const foundUser = teachers.find(
          t => (t.username.toLowerCase() === username.toLowerCase() || t.nip === username) && t.password === password
        );

        if (foundUser) {
          onLogin(foundUser);
        } else {
          setErrorMsg('Username atau kata sandi tidak ditemukan!');
        }
      };

      return (
        <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
          <div className="bg-white w-full max-w-md rounded-3xl shadow-xl overflow-hidden border border-slate-100">
            <div className="bg-gradient-to-br from-emerald-800 to-teal-900 p-8 text-white text-center">
              <div className="w-16 h-16 bg-white rounded-2xl flex items-center justify-center font-black text-2xl mx-auto mb-3 text-emerald-800 shadow-inner overflow-hidden">
                {madrasahInfo.logoUrl ? (
                  <img src={madrasahInfo.logoUrl} alt="Logo" className="w-full h-full object-contain" onError={(e) => { e.target.style.display = 'none'; }} />
                ) : 'M'}
              </div>
              <h2 className="text-2xl font-black tracking-tight">{madrasahInfo.name}</h2>
              <p className="text-xs text-emerald-200 mt-1">Portal SIMADRASAH Online</p>
            </div>

            <div className="p-6">
              <div className="flex bg-slate-100 p-1 rounded-2xl mb-6">
                <button
                  type="button"
                  onClick={() => handleQuickFill('guru')}
                  className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition cursor-pointer ${
                    role === 'guru' ? 'bg-white text-emerald-800 shadow-xs' : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  👨‍🏫 Login Guru
                </button>
                <button
                  type="button"
                  onClick={() => handleQuickFill('admin')}
                  className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition cursor-pointer ${
                    role === 'admin' ? 'bg-white text-emerald-800 shadow-xs' : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  🛡️ Login Admin / TU
                </button>
              </div>

              {errorMsg && (
                <div className="mb-4 bg-rose-50 border border-rose-200 text-rose-700 p-3 rounded-xl text-xs flex items-center gap-2">
                  <Icon name="AlertTriangle" size={16} />
                  <span>{errorMsg}</span>
                </div>
              )}

              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider">
                    Username / NIP Guru
                  </label>
                  <input
                    type="text"
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    placeholder="Masukkan username atau NIP"
                    className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider">
                    Kata Sandi (Password)
                  </label>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    placeholder="Masukkan kata sandi"
                    className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-3.5 rounded-xl text-sm shadow-md transition cursor-pointer flex items-center justify-center gap-2 mt-2"
                >
                  <span>Masuk Portal</span>
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    }

    function JurnalModule({ journals, setJournals, currentUser, madrasahInfo, onSync }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedClass, setSelectedClass] = useState('Semua');
      const [isModalOpen, setIsModalOpen] = useState(false);

      const [formData, setFormData] = useState({
        date: new Date().toISOString().split('T')[0],
        timeSlot: 'Jam ke-1',
        className: 'X-A',
        subject: currentUser.subject && currentUser.subject !== 'Administrator / TU' ? currentUser.subject : 'Fiqih',
        topic: '',
        status: 'Selesai',
        notes: ''
      });

      const filteredJournals = journals.filter((j) => {
        const matchSearch =
          j.subject.toLowerCase().includes(searchTerm.toLowerCase()) ||
          j.topic.toLowerCase().includes(searchTerm.toLowerCase()) ||
          j.teacher.toLowerCase().includes(searchTerm.toLowerCase());
        const matchClass = selectedClass === 'Semua' || j.className === selectedClass;
        return matchSearch && matchClass;
      });

      const handleAddJournal = (e) => {
        e.preventDefault();
        if (!formData.topic) return;

        const newEntry = {
          id: Date.now(),
          ...formData,
          teacher: currentUser.name
        };

        setJournals([newEntry, ...journals]);
        setIsModalOpen(false);
        setFormData({
          date: new Date().toISOString().split('T')[0],
          timeSlot: 'Jam ke-1',
          className: 'X-A',
          subject: currentUser.subject && currentUser.subject !== 'Administrator / TU' ? currentUser.subject : 'Fiqih',
          topic: '',
          status: 'Selesai',
          notes: ''

            </div>

            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={() => window.print()}
                className="bg-white/10 hover:bg-white/20 text-white font-bold px-4 py-2.5 rounded-xl text-xs backdrop-blur-md transition flex items-center gap-1.5 cursor-pointer border border-white/20"
              >
                <Icon name="Printer" size={16} /> Cetak Jurnal PDF
              </button>
              <button
                type="button"
                onClick={() => setIsModalOpen(true)}

              <Icon name="Search" className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" size={18} />
              <input
                type="text"
                placeholder="Cari mapel, topik materi, atau nama guru..."

                onChange={(e) => setSearchTerm(e.target.value)}

            <select

              <option value="XI-A">Kelas XI-A</option>
              <option value="XI-B">Kelas XI-B</option>
              <option value="XII-A">Kelas XII-A</option>
            </select>
          </div>

                        </button>

      const [pasteData, setPasteData] = useState('');

      const filteredStudents = students.filter((s) => {
        const matchSearch = s.name.toLowerCase().includes(searchTerm.toLowerCase()) || s.nisn.includes(searchTerm);
        const matchClass = selectedClass === 'Semua' || s.class === selectedClass;
        return matchSearch && matchClass;
      });

      const handleDownloadSingleHD = async (student) => {
        const dataUrl = await generateHDQRCodeCanvas(student);
        const link = document.createElement('a');
        link.download = `QR_${student.name.replace(/\s+/g, '_')}_${student.nisn}_2000px.png`;
        link.href = dataUrl;
        link.click();
      };

      const handleDownloadTemplate = () => {
        const csvHeader = 'Nama Lengkap,NISN,Kelas,Jenis Kelamin (L/P)\nAhmad Fauzi,0051234568,X-A,L\nSiti Rahma,0051234569,X-A,P';
        const blob = new Blob([csvHeader], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'Template_Import_Siswa_SIMADRASAH.csv';
        link.click();
      };

      const handleImportBulkSiswa = () => {
        if (!pasteData.trim()) return;
        const lines = pasteData.trim().split('\n');
        const newStudents = [];

        lines.forEach((line, idx) => {
          const parts = line.split(/,|\t/);
          if (parts.length >= 2) {
            const name = parts[0]?.trim();
            const nisn = parts[1]?.trim();
            const cls = parts[2]?.trim() || 'X-A';
            const gender = parts[3]?.trim().toUpperCase() || 'L';

            if (name && nisn && !name.toLowerCase().includes('nama')) {
              newStudents.push({
                id: Date.now() + idx,
                name,
                nisn,
                class: cls,
                gender
              });
            }
          }
        });

        if (newStudents.length > 0) {
          setStudents([...students, ...newStudents]);
          setPasteData('');
          setIsImportModalOpen(false);
          if (onSync) onSync();
        }
      };

      const handleDeleteSingleStudent = (studentId, studentName) => {
        if (window.confirm(`Apakah Anda yakin ingin menghapus data siswa "${studentName}"?`)) {

    function PenilaianModule({ students, studentGrades, setStudentGrades, onSync }) {
      const [selectedClass, setSelectedClass] = useState('X-A');
      const [selectedSubject, setSelectedSubject] = useState('Fiqih');

      const filteredStudents = students.filter(s => s.class === selectedClass);

      const getStudentGrade = (studentId) => {
        return studentGrades.find(g => g.studentId === studentId && g.subject === selectedSubject) || {
          studentId,
          subject: selectedSubject,
          uh: 80,
          tugas: 80,
          uts: 80,
          uas: 80
        };
      };

      const handleGradeChange = (studentId, field, val) => {
        const num = Math.min(100, Math.max(0, parseInt(val) || 0));
        const existing = studentGrades.find(g => g.studentId === studentId && g.subject === selectedSubject);

        if (existing) {
          setStudentGrades(studentGrades.map(g => g.studentId === studentId && g.subject === selectedSubject ? { ...g, [field]: num } : g));
        } else {
          setStudentGrades([...studentGrades, { studentId, subject: selectedSubject, uh: 80, tugas: 80, uts: 80, uas: 80, [field]: num }]);
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-emerald-800 to-teal-800 rounded-3xl p-6 sm:p-8 text-white shadow-lg">
            <h2 className="text-2xl sm:text-3xl font-black">Penilaian & Leger Rapor</h2>
            <p className="text-emerald-100 text-xs sm:text-sm mt-1">Olah Nilai UH, Tugas, UTS, dan UAS Otomatis (KKM 75).</p>
          </div>

          <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs flex flex-wrap gap-3 justify-between items-center">
            <div className="flex gap-3">
              <select
                value={selectedClass}
                onChange={(e) => setSelectedClass(e.target.value)}
                className="px-3 py-2 border border-slate-200 rounded-xl text-xs font-bold bg-white outline-none"
              >
                <option value="X-A">Kelas X-A</option>
                <option value="XI-A">Kelas XI-A</option>
                <option value="XI-B">Kelas XI-B</option>
                <option value="XII-A">Kelas XII-A</option>
              </select>

              <select
                value={selectedSubject}
                onChange={(e) => setSelectedSubject(e.target.value)}
                className="px-3 py-2 border border-slate-200 rounded-xl text-xs font-bold bg-white outline-none"
              >
                <option value="Fiqih">Fiqih</option>
                <option value="Al-Qur'an Hadits">Al-Qur'an Hadits</option>
                <option value="Akidah Akhlak">Akidah Akhlak</option>
                <option value="SKI">SKI</option>
              </select>

            <button

              onClick={onSync}
              className="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-xs cursor-pointer"

              Simpan & Sinkronkan
            </button>
          </div>

          <div className="bg-white rounded-2xl border border-slate-100 shadow-xs overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-100 text-[11px] font-bold text-slate-500 uppercase">
                    <th className="py-3 px-4">Nama Siswa</th>
                    <th className="py-3 px-4 text-center">UH (20%)</th>
                    <th className="py-3 px-4 text-center">Tugas (20%)</th>
                    <th className="py-3 px-4 text-center">UTS (30%)</th>
                    <th className="py-3 px-4 text-center">UAS (30%)</th>
                    <th className="py-3 px-4 text-center">Nilai Akhir</th>
                    <th className="py-3 px-4 text-center">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 text-xs">
                  {filteredStudents.map((s) => {
                    const g = getStudentGrade(s.id);
                    const finalGrade = Math.round(g.uh * 0.2 + g.tugas * 0.2 + g.uts * 0.3 + g.uas * 0.3);
                    const isPassed = finalGrade >= 75;

                    return (
                      <tr key={s.id} className="hover:bg-slate-50">
                        <td className="py-3 px-4 font-bold text-slate-800">
                          <p>{s.name}</p>
                          <p className="text-[10px] text-slate-400 font-mono">NISN: {s.nisn}</p>

                        <td className="py-3 px-4 text-center">
                          <input type="number" value={g.uh} onChange={(e) => handleGradeChange(s.id, 'uh', e.target.value)} className="w-16 p-1.5 border border-slate-200 rounded-lg text-center font-bold" />
                        </td>
                        <td className="py-3 px-4 text-center">
                          <input type="number" value={g.tugas} onChange={(e) => handleGradeChange(s.id, 'tugas', e.target.value)} className="w-16 p-1.5 border border-slate-200 rounded-lg text-center font-bold" />

                        <td className="py-3 px-4 text-center">
                          <input type="number" value={g.uts} onChange={(e) => handleGradeChange(s.id, 'uts', e.target.value)} className="w-16 p-1.5 border border-slate-200 rounded-lg text-center font-bold" />

                        <td className="py-3 px-4 text-center">
                          <input type="number" value={g.uas} onChange={(e) => handleGradeChange(s.id, 'uas', e.target.value)} className="w-16 p-1.5 border border-slate-200 rounded-lg text-center font-bold" />

                        <td className="py-3 px-4 text-center font-black text-sm text-slate-800">{finalGrade}</td>
                        <td className="py-3 px-4 text-center">
                          <span className={`font-bold px-2.5 py-0.5 rounded-full text-[10px] ${isPassed ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                            {isPassed ? 'Tuntas' : 'Remidial'}
                          </span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function PengaturanModule({ madrasahInfo, setMadrasahInfo, students, setStudents, teachers, setTeachers, spreadsheetUrl, setSpreadsheetUrl, onSync }) {
      const [activeSubTab, setActiveSubTab] = useState('identitas');
      const [infoForm, setInfoForm] = useState({ ...madrasahInfo });
      const [studentForm, setStudentForm] = useState({ name: '', nisn: '', class: 'X-A', gender: 'L' });
      const [teacherForm, setTeacherForm] = useState({ nip: '', name: '', username: '', password: '', subject: 'Fiqih', role: 'guru' });
      const [bulkStudentPaste, setBulkStudentPaste] = useState('');
      const [bulkTeacherPaste, setBulkTeacherPaste] = useState('');

      const handleSaveInfo = (e) => {
        e.preventDefault();
        setMadrasahInfo({ ...infoForm });
        alert('✅ Identitas Madrasah berhasil diperbarui!');
        if (onSync) onSync();
      };

      const handleAddSingleStudent = (e) => {
        e.preventDefault();
        if (!studentForm.name || !studentForm.nisn) return;
        const newS = { id: Date.now(), ...studentForm };
        setStudents([...students, newS]);
        setStudentForm({ name: '', nisn: '', class: 'X-A', gender: 'L' });
        if (onSync) onSync();
      };

      const handleImportBulkStudents = () => {
        if (!bulkStudentPaste.trim()) return;
        const lines = bulkStudentPaste.trim().split('\n');
        const newS = [];

        lines.forEach((line, idx) => {
          const parts = line.split(/,|\t/);
          if (parts.length >= 2) {
            const name = parts[0]?.trim();
            const nisn = parts[1]?.trim();
            const cls = parts[2]?.trim() || 'X-A';
            const gender = parts[3]?.trim().toUpperCase() || 'L';

            if (name && nisn && !name.toLowerCase().includes('nama')) {
              newS.push({ id: Date.now() + idx, name, nisn, class: cls, gender });
            }
          }
        });

        if (newS.length > 0) {
          setStudents([...students, ...newS]);
          setBulkStudentPaste('');
          alert(`✅ Berhasil mengimpor ${newS.length} siswa baru!`);
          if (onSync) onSync();
        }
      };

      const handleClearAllStudents = () => {
        if (window.confirm('⚠️ PERINGATAN: Apakah Anda yakin ingin MENGHAPUS SEMUA DATA SISWA? Tindakan ini tidak dapat dibatalkan.')) {
          setStudents([]);
          alert('✅ Seluruh data siswa berhasil dihapus.');
          if (onSync) onSync();
        }
      };

      const handleAddSingleTeacher = (e) => {
        e.preventDefault();
        if (!teacherForm.name || !teacherForm.username || !teacherForm.password) return;
        const newT = { id: 'G_' + Date.now(), ...teacherForm };
        setTeachers([...teachers, newT]);
        setTeacherForm({ nip: '', name: '', username: '', password: '', subject: 'Fiqih', role: 'guru' });
        alert('✅ Guru berhasil ditambahkan!');
        if (onSync) onSync();
      };

      const handleImportBulkTeachers = () => {
        if (!bulkTeacherPaste.trim()) return;
        const lines = bulkTeacherPaste.trim().split('\n');
        const newT = [];

        lines.forEach((line, idx) => {
          const parts = line.split(/,|\t/);
          if (parts.length >= 3) {
            const name = parts[0]?.trim();
            const nip = parts[1]?.trim() || '';
            const username = parts[2]?.trim();
            const password = parts[3]?.trim() || '123456';
            const subject = parts[4]?.trim() || 'Umum';
            const role = parts[5]?.trim().toLowerCase() === 'admin' ? 'admin' : 'guru';

            if (name && username && !name.toLowerCase().includes('nama')) {
              newT.push({ id: 'G_IMP_' + (Date.now() + idx), nip, name, username, password, subject, role });
            }
          }
        });

        if (newT.length > 0) {
          setTeachers([...teachers, ...newT]);
          setBulkTeacherPaste('');
          alert(`✅ Berhasil mengimpor ${newT.length} guru baru!`);
          if (onSync) onSync();
        }
      };

      return (
        <div className="space-y-6">

              onClick={() => setActiveSubTab('identitas')}

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">NIP Kepala Madrasah</label>
                    <input type="text" value={infoForm.headmasterNip} onChange={(e) => setInfoForm({ ...infoForm, headmasterNip: e.target.value })} className="w-full p-2.5 border border-slate-200 rounded-xl font-mono outline-none" />
                  </div>
                </div>

                <div>
                  <label className="block font-bold text-slate-700 mb-1">URL Logo Madrasah</label>
                  <input type="url" value={infoForm.logoUrl} onChange={(e) => setInfoForm({ ...infoForm, logoUrl: e.target.value })} placeholder="https://.../logo.png" className="w-full p-2.5 border border-slate-200 rounded-xl font-mono outline-none" />
                </div>

                <div className="pt-2 flex justify-end">
                  <button type="submit" className="px-6 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl shadow-md transition cursor-pointer">
                    Simpan Perubahan Identitas
                  </button>
                </div>
              </form>
            </div>
          )}

          {activeSubTab === 'siswa' && (
            <div className="space-y-6">
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div className="bg-white rounded-3xl border border-slate-100 p-6 shadow-xs space-y-4">
                  <h3 className="text-sm font-bold text-slate-800 border-b border-slate-100 pb-3">Tambah Siswa Tunggal</h3>
                  <form onSubmit={handleAddSingleStudent} className="space-y-3 text-xs">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Nama Lengkap</label>
                      <input type="text" value={studentForm.name} onChange={(e) => setStudentForm({ ...studentForm, name: e.target.value })} className="w-full p-2.5 border border-slate-200 rounded-xl outline-none" required />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">NISN</label>
                      <input type="text" value={studentForm.nisn} onChange={(e) => setStudentForm({ ...studentForm, nisn: e.target.value })} className="w-full p-2.5 border border-slate-200 rounded-xl font-mono outline-none" required />
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-emerald-700 text-white font-bold rounded-xl shadow-xs cursor-pointer">
                      + Tambah Siswa
                    </button>
                  </form>
                </div>

                <div className="bg-white rounded-3xl border border-slate-100 p-6 shadow-xs space-y-4 flex flex-col justify-between">
                  <div>
                    <h3 className="text-sm font-bold text-slate-800 border-b border-slate-100 pb-3">Import Masal Siswa (Paste CSV)</h3>
                    <textarea value={bulkStudentPaste} onChange={(e) => setBulkStudentPaste(e.target.value)} rows={5} placeholder="Ahmad Fauzi,0051234568,X-A,L" className="w-full p-3 border border-slate-200 rounded-2xl text-xs font-mono outline-none resize-none mt-2"></textarea>
                  </div>
                  <div className="flex gap-2">
                    <button type="button" onClick={handleClearAllStudents} className="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 py-2.5 px-4 rounded-xl font-bold text-xs cursor-pointer flex items-center gap-1">
                      <Icon name="Trash2" size={14} />
                      <span>Hapus Semua</span>
                    </button>
                    <button type="button" onClick={handleImportBulkStudents} className="flex-1 py-2.5 bg-slate-800 text-white font-bold rounded-xl shadow-xs cursor-pointer text-xs">
                      Proses Import Masal Siswa
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {activeSubTab === 'guru' && (
            <div className="space-y-6">
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div className="bg-white rounded-3xl border border-slate-100 p-6 shadow-xs space-y-4">
                  <h3 className="text-sm font-bold text-slate-800 border-b border-slate-100 pb-3">Tambah Guru Tunggal</h3>
                  <form onSubmit={handleAddSingleTeacher} className="space-y-3 text-xs">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Nama Lengkap & Gelar</label>
                      <input type="text" value={teacherForm.name} onChange={(e) => setTeacherForm({ ...teacherForm, name: e.target.value })} placeholder="Ustadz Ahmad, M.Pd" className="w-full p-2.5 border border-slate-200 rounded-xl outline-none" required />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">NIP (Opsional)</label>
                        <input type="text" value={teacherForm.nip} onChange={(e) => setTeacherForm({ ...teacherForm, nip: e.target.value })} placeholder="1990..." className="w-full p-2.5 border border-slate-200 rounded-xl font-mono outline-none" />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Mata Pelajaran</label>
                        <input type="text" value={teacherForm.subject} onChange={(e) => setTeacherForm({ ...teacherForm, subject: e.target.value })} placeholder="Fiqih" className="w-full p-2.5 border border-slate-200 rounded-xl outline-none" required />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Username Login</label>
                        <input type="text" value={teacherForm.username} onChange={(e) => setTeacherForm({ ...teacherForm, username: e.target.value })} placeholder="ahmad123" className="w-full p-2.5 border border-slate-200 rounded-xl font-mono outline-none" required />
                      </div>
                      <div>
                        <label className="block font-bold text-slate-700 mb-1">Password</label>
                        <input type="text" value={teacherForm.password} onChange={(e) => setTeacherForm({ ...teacherForm, password: e.target.value })} placeholder="123456" className="w-full p-2.5 border border-slate-200 rounded-xl font-mono outline-none" required />
                      </div>
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-emerald-700 text-white font-bold rounded-xl shadow-xs cursor-pointer">
                      + Tambah Guru
                    </button>
                  </form>
                </div>

                <div className="bg-white rounded-3xl border border-slate-100 p-6 shadow-xs space-y-4 flex flex-col justify-between">
                  <div>
                    <h3 className="text-sm font-bold text-slate-800 border-b border-slate-100 pb-3">Import Masal Guru (Paste CSV)</h3>
                    <p className="text-[11px] text-slate-500 mt-1">Format: Nama, NIP, Username, Password, Mapel, Role (guru/admin)</p>
                    <textarea value={bulkTeacherPaste} onChange={(e) => setBulkTeacherPaste(e.target.value)} rows={5} placeholder="Ustadz Mansur,19900101,mansur,123456,Fiqih,guru&#10;Ustadzah Nur,19920202,nur,123456,SKI,guru" className="w-full p-3 border border-slate-200 rounded-2xl text-xs font-mono outline-none resize-none mt-2"></textarea>
                  </div>
                  <button type="button" onClick={handleImportBulkTeachers} className="w-full py-2.5 bg-slate-800 text-white font-bold rounded-xl shadow-xs cursor-pointer text-xs">
                    Proses Import Masal Guru
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function GoogleSheetsModal({ spreadsheetUrl, setSpreadsheetUrl, onClose }) {
      const [tempUrl, setTempUrl] = useState(spreadsheetUrl);

      const handleSave = () => {
        localStorage.setItem('simadrasah_sheet_url', tempUrl);
        setSpreadsheetUrl(tempUrl);
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-white w-full max-w-xl rounded-3xl shadow-2xl p-6 space-y-4">
            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
              <h3 className="font-bold text-base text-slate-800 flex items-center gap-2">
                <Icon name="Database" className="text-emerald-700" size={20} /> Google Spreadsheets Database URL
              </h3>
              <button type="button" onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1">
                <Icon name="X" size={20} />
              </button>
            </div>

            <div className="space-y-3 text-xs">
              <div>
                <label className="block font-bold text-slate-700 mb-1">Web App Endpoint URL (Google Apps Script)</label>
                <input
                  type="url"
                  value={tempUrl}
                  onChange={(e) => setTempUrl(e.target.value)}
                  placeholder="https://script.google.com/macros/s/.../exec"
                  className="w-full p-3 border border-slate-200 rounded-xl font-mono text-[11px] outline-none"
                />
              </div>
            </div>

            <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
              <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold">
                Batal
              </button>
              <button type="button" onClick={handleSave} className="px-5 py-2 bg-emerald-700 text-white rounded-xl font-bold hover:bg-emerald-800 shadow-md cursor-pointer">
                Simpan Endpoint
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <MainAppContent />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
