    function SimpleQRCodeSVG({ value, size = 120 }) {
      const str = String(value || '');
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }

      const gridSize = 15;
      const cells = [];
      
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const isCornerTL = r < 4 && c < 4;
          const isCornerTR = r < 4 && c >= gridSize - 4;
          const isCornerBL = r >= gridSize - 4 && c < 4;

          if (isCornerTL || isCornerTR || isCornerBL) {
            const isBorder = r === 0 || r === 3 || c === 0 || c === 3 ||
                             r === gridSize - 1 || r === gridSize - 4 ||
                             c === gridSize - 1 || c === gridSize - 4;
            const isCenter = (r === 1 || r === 2) && (c === 1 || c === 2) ||
                             (r === 1 || r === 2) && (c === gridSize - 3 || c === gridSize - 2) ||
                             (r === gridSize - 3 || r === gridSize - 2) && (c === 1 || c === 2);
            if (isBorder || isCenter) cells.push({ r, c });
          } else {
            const seed = Math.sin(hash + r * gridSize + c) * 10000;
            if ((seed - Math.floor(seed)) > 0.48) {
              cells.push({ r, c });
            }
          }
        }
      }

      const cellSize = size / gridSize;

      return (
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="bg-white p-1.5 rounded-lg border border-slate-200">
          {cells.map((cell, idx) => (
            <rect
              key={idx}
              x={cell.c * cellSize}
              y={cell.r * cellSize}
              width={cellSize - 0.2}
              height={cellSize - 0.2}
              fill="#0f172a"
              rx={0.5}
            />
          ))}
        </svg>
      );
    }

    function generateHDQRCodeCanvas(student, format = 'qr_only') {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        if (format === 'qr_only') {
          canvas.width = 2000;
          canvas.height = 2000;

          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, 2000, 2000);

          ctx.fillStyle = '#065f46';
          ctx.fillRect(0, 0, 2000, 30);

          const qrSize = 1450;
          const startX = (2000 - qrSize) / 2;
          const startY = 160;

          ctx.strokeStyle = '#e2e8f0';
          ctx.lineWidth = 12;
          ctx.strokeRect(startX - 20, startY - 20, qrSize + 40, qrSize + 40);

          const str = String(student.nisn || '0000000000');
          let hash = 0;
          for (let i = 0; i < str.length; i++) {
            hash = (hash << 5) - hash + str.charCodeAt(i);
            hash |= 0;
          }

          const gridSize = 21;
          const cellSize = qrSize / gridSize;

          ctx.fillStyle = '#0f172a';

          for (let r = 0; r < gridSize; r++) {
            for (let c = 0; c < gridSize; c++) {
              const isCornerTL = r < 5 && c < 5;
              const isCornerTR = r < 5 && c >= gridSize - 5;
              const isCornerBL = r >= gridSize - 5 && c < 5;

              if (isCornerTL || isCornerTR || isCornerBL) {
                const isBorder = r === 0 || r === 4 || c === 0 || c === 4 ||
                                 r === gridSize - 1 || r === gridSize - 5 ||
                                 c === gridSize - 1 || c === gridSize - 5;
                const isCenter = (r >= 1 && r <= 3) && (c >= 1 && c <= 3) ||
                                 (r >= 1 && r <= 3) && (c >= gridSize - 4 && c <= gridSize - 2) ||
                                 (r >= gridSize - 4 && r <= gridSize - 2) && (c >= 1 && c <= 3);
                if (isBorder || isCenter) {
                  ctx.fillRect(startX + c * cellSize, startY + r * cellSize, cellSize - 1, cellSize - 1);
                }
              } else {
                const seed = Math.sin(hash + r * gridSize + c) * 10000;
                if ((seed - Math.floor(seed)) > 0.45) {
                  ctx.fillRect(startX + c * cellSize, startY + r * cellSize, cellSize - 1, cellSize - 1);
                }
              }
            }
          }

          ctx.textAlign = 'center';
          ctx.fillStyle = '#0f172a';
          ctx.font = 'bold 58px sans-serif';
          ctx.fillText(student.name.toUpperCase(), 1000, 1750);

          ctx.fillStyle = '#047857';
          ctx.font = 'bold 44px monospace';
          ctx.fillText(`NISN: ${student.nisn}`, 1000, 1830);

          ctx.fillStyle = '#94a3b8';
          ctx.font = '500 32px sans-serif';
          ctx.fillText('SIMADRASAH - Presensi QR Code Siswa', 1000, 1920);

          resolve(canvas.toDataURL('image/png'));
        }
      });
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error("App Catch Error Boundary:", error, errorInfo);
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-900 text-white flex items-center justify-center p-6">
              <div className="max-w-md w-full bg-slate-800 p-8 rounded-3xl border border-slate-700 space-y-4 text-center">
                <Icon name="AlertTriangle" size={48} className="text-amber-400 mx-auto" />
                <h2 className="text-xl font-bold">Terjadi Kesalahan Sistem</h2>
                <p className="text-xs text-slate-300 font-mono bg-slate-900/80 p-3 rounded-xl text-left overflow-x-auto">
                  {this.state.error?.toString() || 'Unknown runtime exception'}
                </p>
                <button
                  onClick={() => {
                    localStorage.clear();
                    window.location.reload();
                  }}
                  className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-xs cursor-pointer transition"
                >
                  Reset Data & Reload Application
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

      useEffect(() => { localStorage.setItem('simadrasah_grades', JSON.stringify(studentGrades)); }, [studentGrades]);

      useEffect(() => {
        const fetchInitialDataFromGAS = async () => {
          const activeUrl = spreadsheetUrl || DEFAULT_GAS_URL;
          if (!activeUrl) return;

          try {
            setIsSyncing(true);
            setSyncStatus('🔄 Terhubung ke Google Sheets, mengunduh data...');
            const response = await fetch(activeUrl);
            const json = await response.json();

            if (json && json.status === 'success' && json.data) {
              if (json.data.teachers?.length > 0) setTeachers(json.data.teachers);
              if (json.data.students?.length > 0) setStudents(json.data.students);
              if (json.data.journals?.length > 0) setJournals(json.data.journals);
              if (json.data.masterViolations?.length > 0) setMasterViolations(json.data.masterViolations);
              if (json.data.violationLogs?.length > 0) setViolationLogs(json.data.violationLogs);
              if (json.data.attendanceLogs?.length > 0) setAttendanceLogs(json.data.attendanceLogs);
              if (json.data.studentGrades?.length > 0) setStudentGrades(json.data.studentGrades);
              setSyncStatus('✅ Berhasil memuat data dari Google Sheets!');
            }
          } catch (err) {
            setSyncStatus('ℹ️ Menggunakan data lokal.');
          } finally {
            setIsSyncing(false);
            setTimeout(() => setSyncStatus(''), 4000);
          }
        };

        fetchInitialDataFromGAS();
      }, []);

      const handleLogin = (user) => {

      const handleSyncDrive = async () => {
        if (!spreadsheetUrl) {
          setIsDbModalOpen(true);
          return;
        }
        setIsSyncing(true);
        setSyncStatus('Menghubungkan ke Google Apps Script API...');

        try {
          const payload = {
            action: 'sync_all',
            teachers,
            students,
            journals,
            masterViolations,
            violationLogs,
            attendanceLogs,

    function LoginPage({ onLogin, teachers }) {
      const [role, setRole] = useState('guru');
      const [username, setUsername] = useState('guru1');
      const [password, setPassword] = useState('123456');
      const [showPassword, setShowPassword] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const handleQuickFill = (selectedRole) => {
        setRole(selectedRole);
        if (selectedRole === 'guru') {
          const g = teachers.find(t => t.role === 'guru') || { username: 'guru1', password: '123456' };
          setUsername(g.username);
          setPassword(g.password);
        } else {
          const a = teachers.find(t => t.role === 'admin') || { username: 'admin', password: 'admin123' };
          setUsername(a.username);
          setPassword(a.password);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!username || !password) {
          setErrorMsg('Harap isi username dan kata sandi.');
          return;
        }

        const foundUser = teachers.find(
          t => (t.username.toLowerCase() === username.toLowerCase() || t.nip === username) && t.password === password
        );

        if (foundUser) {
          onLogin(foundUser);
        } else {
          setErrorMsg('Username atau kata sandi tidak ditemukan!');
        }
      };

      return (
        <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">

              <div className="w-16 h-16 bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl flex items-center justify-center font-black text-2xl mx-auto mb-3 shadow-inner">

              <p className="text-xs text-emerald-200 mt-1">Portal Administrasi Guru & Madrasah</p>
            </div>

            <div className="p-6">
              <div className="flex bg-slate-100 p-1 rounded-2xl mb-6">
                <button
                  type="button"
                  onClick={() => handleQuickFill('guru')}
                  className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition cursor-pointer ${
                    role === 'guru' ? 'bg-white text-emerald-800 shadow-xs' : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  👨‍🏫 Login Guru
                </button>
                <button
                  type="button"
                  onClick={() => handleQuickFill('admin')}
                  className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition cursor-pointer ${
                    role === 'admin' ? 'bg-white text-emerald-800 shadow-xs' : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  🛡️ Login Admin / TU
                </button>
              </div>

              {errorMsg && (
                <div className="mb-4 bg-rose-50 border border-rose-200 text-rose-700 p-3 rounded-xl text-xs flex items-center gap-2">
                  <Icon name="AlertCircle" size={16} />
                  <span>{errorMsg}</span>
                </div>
              )}

              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider">
                    Username / NIP Guru
                  </label>
                  <input
                    type="text"
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    placeholder="Masukkan username atau NIP"
                    className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider">
                    Kata Sandi (Password)
                  </label>
                  <div className="relative">
                    <input
                      type={showPassword ? 'text' : 'password'}
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder="Masukkan kata sandi"
                      className="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none pr-10"
                    />
                    <button
                      type="button"
                      onClick={() => setShowPassword(!showPassword)}
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                    >
                      <Icon name={showPassword ? "EyeOff" : "Eye"} size={18} />

                  </div>
                </div>

                <button
                  type="submit"

                  <span>Masuk Portal</span>
                  <Icon name="ArrowRight" size={18} />
                </button>
              </form>
            </div>
          </div>
        </div>
      );

        return matchSearch && matchClass;

    function AbsensiQRModule({ students, attendanceLogs, setAttendanceLogs, onSync }) {
      const [scanStatusMsg, setScanStatusMsg] = useState('');

      const handleScanSimulated = (student) => {
        const today = new Date().toISOString().split('T')[0];
        const nowTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        const newLog = {
          id: Date.now(),
          studentId: student.id,
          studentName: student.name,
          nisn: student.nisn,
          studentClass: student.class,
          date: today,
          time: nowTime,
          status: 'Hadir'
        };

        setAttendanceLogs([newLog, ...attendanceLogs]);
        setScanStatusMsg(`✅ Presensi ${student.name} (${student.nisn}) Berhasil Di-scan!`);
        setTimeout(() => setScanStatusMsg(''), 4000);

        if (onSync) onSync();
      };

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-emerald-800 to-teal-800 rounded-3xl p-6 sm:p-8 text-white shadow-lg">
            <div className="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold mb-3 border border-white/20">
              <Icon name="QrCode" size={14} /> Presensi Berbasis NISN Permanen
            </div>
            <h2 className="text-2xl sm:text-3xl font-black">Presensi QR Code Siswa</h2>
          </div>

          {scanStatusMsg && (
            <div className="p-4 bg-emerald-100 border border-emerald-300 text-emerald-900 rounded-2xl text-xs font-bold flex items-center gap-2 shadow-sm">
              <Icon name="CheckCircle" size={18} />
              <span>{scanStatusMsg}</span>
            </div>
          )}

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-xs space-y-4">
              <h3 className="font-bold text-sm text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-3">
                <Icon name="Camera" className="text-emerald-700" size={18} /> Pemindai QR Code
              </h3>

              <div className="bg-slate-900 rounded-2xl h-64 flex flex-col items-center justify-center text-center p-6 text-slate-300 relative overflow-hidden">
                <div className="w-40 h-40 border-2 border-dashed border-emerald-400/60 rounded-2xl flex items-center justify-center relative">
                  <Icon name="QrCode" size={64} className="text-emerald-400/40 animate-pulse" />
                </div>
                <p className="text-[11px] text-slate-400 mt-3 font-medium">Arahkan Kartu QR Siswa ke Kamera</p>
              </div>

              <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Simulasi Scan Cepat 1-Klik:</p>
              <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                {students.slice(0, 5).map((s) => (
                  <button
                    key={s.id}
                    type="button"
                    onClick={() => handleScanSimulated(s)}
                    className="w-full text-left p-2.5 bg-slate-50 hover:bg-emerald-50 border border-slate-100 rounded-xl transition cursor-pointer flex items-center justify-between"
                  >
                    <div>
                      <p className="font-bold text-xs text-slate-800">{s.name}</p>
                      <p className="text-[10px] text-slate-400 font-mono">NISN: {s.nisn} | {s.class}</p>
                    </div>
                    <span className="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-2 py-1 rounded-md">Scan</span>
                  </button>
                ))}
              </div>
            </div>

            <div className="lg:col-span-2 bg-white rounded-3xl border border-slate-100 shadow-xs p-6 space-y-4">
              <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 className="font-bold text-sm text-slate-800 flex items-center gap-2">
                  <Icon name="Clock" className="text-emerald-700" size={18} /> Riwayat Presensi Masuk
                </h3>
                <span className="text-xs font-bold text-emerald-800 bg-emerald-50 px-3 py-1 rounded-full">
                  {attendanceLogs.length} Siswa Hadir
                </span>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-50 text-[10px] font-bold text-slate-400 uppercase border-b border-slate-100">
                      <th className="py-2.5 px-3">Waktu</th>
                      <th className="py-2.5 px-3">Siswa & NISN</th>
                      <th className="py-2.5 px-3">Kelas</th>
                      <th className="py-2.5 px-3">Status</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 text-xs">
                    {attendanceLogs.length === 0 ? (
                      <tr>
                        <td colSpan={4} className="py-8 text-center text-slate-400">Belum ada pemindaian presensi hari ini.</td>
                      </tr>
                    ) : (
                      attendanceLogs.map((log) => (
                        <tr key={log.id} className="hover:bg-slate-50 transition">
                          <td className="py-2.5 px-3 font-mono font-bold text-slate-700">{log.time}</td>
                          <td className="py-2.5 px-3">
                            <p className="font-bold text-slate-800">{log.studentName}</p>
                            <p className="text-[10px] text-slate-400 font-mono">{log.nisn}</p>

                          <td className="py-2.5 px-3 font-bold text-emerald-800">{log.studentClass}</td>
                          <td className="py-2.5 px-3">
                            <span className="bg-emerald-100 text-emerald-800 font-bold px-2.5 py-0.5 rounded-full text-[10px]">

                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

              <Icon name="Search" className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" size={18} />

                type="text"
                placeholder="Cari nama siswa atau NISN..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}

              />
            </div>
            <select
              value={selectedClass}
              onChange={(e) => setSelectedClass(e.target.value)}
              className="px-3 py-2.5 border border-slate-200 rounded-xl text-xs font-bold text-slate-600 bg-white outline-none w-full sm:w-auto"

              <option value="Semua">Semua Kelas</option>
              <option value="X-A">Kelas X-A</option>
              <option value="XI-A">Kelas XI-A</option>
              <option value="XI-B">Kelas XI-B</option>
              <option value="XII-A">Kelas XII-A</option>

          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {filteredStudents.map((s) => (
              <div key={s.id} className="bg-white rounded-3xl border border-slate-100 p-5 shadow-xs hover:shadow-md transition space-y-4 flex flex-col justify-between">
                <div className="flex items-start justify-between gap-3">
                  <div>
                    <span className="bg-emerald-100 text-emerald-800 font-bold px-2.5 py-0.5 rounded-full text-[10px] inline-block mb-1">{s.class}</span>
                    <h4 className="font-bold text-slate-800 text-sm">{s.name}</h4>
                    <p className="text-[11px] font-mono text-slate-400 mt-0.5">NISN: {s.nisn}</p>
                  </div>
                  <SimpleQRCodeSVG value={s.nisn} size={64} />
                </div>

                <div className="pt-2 border-t border-slate-100 flex items-center justify-between">
                  <span className="text-[10px] font-bold text-slate-400">QR Code Murni (2000px)</span>
                  <button
                    type="button"
                    onClick={() => handleDownloadSingleHD(s)}
                    className="bg-emerald-700 hover:bg-emerald-800 text-white text-[11px] font-bold px-3 py-1.5 rounded-xl shadow-xs transition flex items-center gap-1 cursor-pointer"
                  >
                    <Icon name="Download" size={13} />
                    <span>PNG HD</span>
                  </button>
                </div>
              </div>

          <div className="bg-gradient-to-r from-emerald-800 to-teal-800 rounded-3xl p-6 sm:p-8 text-white shadow-lg">

            <p className="text-emerald-100 text-xs sm:text-sm mt-1">Satu Guru Satu Akun Mandiri</p>

          <div className="bg-white rounded-2xl border border-slate-100 shadow-xs overflow-hidden">

                  <tr className="bg-slate-50 border-b border-slate-100 text-[11px] font-bold text-slate-500 uppercase">

    function PenilaianModule({ students, studentGrades, setStudentGrades, onSync }) {
      const [selectedClass, setSelectedClass] = useState('X-A');
      const [selectedSubject, setSelectedSubject] = useState('Fiqih');

      const filteredStudents = students.filter(s => s.class === selectedClass);

      const getStudentGrade = (studentId) => {
        return studentGrades.find(g => g.studentId === studentId && g.subject === selectedSubject) || {
          studentId,
          subject: selectedSubject,
          uh: 80,
          tugas: 80,
          uts: 80,
          uas: 80
        };
      };

      const handleGradeChange = (studentId, field, val) => {
        const num = Math.min(100, Math.max(0, parseInt(val) || 0));
        const existing = studentGrades.find(g => g.studentId === studentId && g.subject === selectedSubject);

        if (existing) {
          setStudentGrades(studentGrades.map(g => g.studentId === studentId && g.subject === selectedSubject ? { ...g, [field]: num } : g));
        } else {
          setStudentGrades([...studentGrades, { studentId, subject: selectedSubject, uh: 80, tugas: 80, uts: 80, uas: 80, [field]: num }]);
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-emerald-800 to-teal-800 rounded-3xl p-6 sm:p-8 text-white shadow-lg">
            <h2 className="text-2xl sm:text-3xl font-black">Penilaian & Leger Rapor</h2>
          </div>

          <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs flex flex-wrap gap-3 items-center justify-between">
            <div className="flex gap-3">
              <select value={selectedClass} onChange={(e) => setSelectedClass(e.target.value)} className="px-3 py-2 border border-slate-200 rounded-xl text-xs font-bold bg-white outline-none">
                <option value="X-A">Kelas X-A</option>
                <option value="XI-A">Kelas XI-A</option>
                <option value="XI-B">Kelas XI-B</option>
                <option value="XII-A">Kelas XII-A</option>
              </select>

              <select value={selectedSubject} onChange={(e) => setSelectedSubject(e.target.value)} className="px-3 py-2 border border-slate-200 rounded-xl text-xs font-bold bg-white outline-none">
                <option value="Fiqih">Fiqih</option>
                <option value="Al-Qur'an Hadits">Al-Qur'an Hadits</option>
              </select>
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-100 shadow-xs overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-100 text-[11px] font-bold text-slate-500 uppercase">
                    <th className="py-3 px-4">Nama Siswa</th>
                    <th className="py-3 px-4 text-center">UH (20%)</th>
                    <th className="py-3 px-4 text-center">Tugas (20%)</th>
                    <th className="py-3 px-4 text-center">UTS (30%)</th>
                    <th className="py-3 px-4 text-center">UAS (30%)</th>
                    <th className="py-3 px-4 text-center">Nilai Akhir</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 text-xs">
                  {filteredStudents.map((s) => {
                    const g = getStudentGrade(s.id);
                    const finalGrade = Math.round(g.uh * 0.2 + g.tugas * 0.2 + g.uts * 0.3 + g.uas * 0.3);

                    return (
                      <tr key={s.id} className="hover:bg-slate-50 transition">
                        <td className="py-3 px-4 font-bold text-slate-800">{s.name}</td>
                        <td className="py-3 px-4 text-center"><input type="number" value={g.uh} onChange={(e) => handleGradeChange(s.id, 'uh', e.target.value)} className="w-16 p-1.5 border border-slate-200 rounded-lg text-center font-bold" /></td>
                        <td className="py-3 px-4 text-center"><input type="number" value={g.tugas} onChange={(e) => handleGradeChange(s.id, 'tugas', e.target.value)} className="w-16 p-1.5 border border-slate-200 rounded-lg text-center font-bold" /></td>
                        <td className="py-3 px-4 text-center"><input type="number" value={g.uts} onChange={(e) => handleGradeChange(s.id, 'uts', e.target.value)} className="w-16 p-1.5 border border-slate-200 rounded-lg text-center font-bold" /></td>
                        <td className="py-3 px-4 text-center"><input type="number" value={g.uas} onChange={(e) => handleGradeChange(s.id, 'uas', e.target.value)} className="w-16 p-1.5 border border-slate-200 rounded-lg text-center font-bold" /></td>
                        <td className="py-3 px-4 text-center font-black text-sm text-slate-800">{finalGrade}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function GoogleSheetsModal({ spreadsheetUrl, setSpreadsheetUrl, onClose }) {

        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-white w-full max-w-xl rounded-3xl shadow-2xl p-6 space-y-4">
            <div className="flex justify-between items-center border-b border-slate-100 pb-3">

              <button type="button" onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1">

            <div className="space-y-3 text-xs">
              <div>
                <label className="block font-bold text-slate-700 mb-1">Web App URL (Google Apps Script Endpoint)</label>
                <input

                />
              </div>
            </div>

            <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
              <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold">
                Batal
              </button>
              <button type="button" onClick={handleSave} className="px-5 py-2 bg-emerald-700 text-white rounded-xl font-bold hover:bg-emerald-800 shadow-md cursor-pointer">
                Simpan Endpoint
              </button>
            </div>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
