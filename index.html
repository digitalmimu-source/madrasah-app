    // Helper untuk Play Audio Beep pada Presensi Berhasil
    function playBeepSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch(e) {
        console.log('Audio API error:', e);
      }
    }

    function Icon({ name, className = '', size = 18 }) {
      const kebabName = useMemo(() => {
        return name
          .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
          .replace(/([A-Z])([A-Z][a-z])/g, '$1-$2')
          .toLowerCase();
      }, [name]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      return <i data-lucide={kebabName} className={className} style={{ width: size, height: size, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}></i>;
    }

    // Component Rendering 100% Valid Standard QR Code Image
    function SimpleQRCodeImage({ value, size = 120 }) {
      const [qrDataUrl, setQrDataUrl] = useState('');

      useEffect(() => {
        if (window.QRCode && value) {
          window.QRCode.toDataURL(String(value).trim(), {
            width: size * 2,
            margin: 1,
            color: { dark: '#0f172a', light: '#ffffff' }
          }).then(url => setQrDataUrl(url)).catch(err => console.error('QR Gen Err:', err));
        }
      }, [value, size]);

      if (!qrDataUrl) {
        return <div style={{ width: size, height: size }} className="bg-slate-100 rounded-lg animate-pulse"></div>;
      }

      return (
        <img
          src={qrDataUrl}
          alt={`QR ${value}`}
          style={{ width: size, height: size }}
          className="bg-white p-1 rounded-lg border border-slate-200 object-contain shadow-xs"
        />
      );
    }

    // Generate High-Resolution Valid Standard 2000px x 2000px QR Code PNG
    function generateHDQRCodeCanvas(student) {
      return new Promise((resolve, reject) => {
        const nisnVal = String(student.nisn || '0000000000').trim();

        if (!window.QRCode) {
          alert('Library QR Code belum dimuat penuh. Silakan coba lagi.');
          return resolve('');
        }

        window.QRCode.toDataURL(nisnVal, {
          width: 1400,
          margin: 1,
          color: { dark: '#0f172a', light: '#ffffff' }
        }).then((qrBase64) => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');

          canvas.width = 2000;
          canvas.height = 2000;

          // Fill White Background
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, 2000, 2000);

          // Top Accent Bar
          ctx.fillStyle = '#047857';
          ctx.fillRect(0, 0, 2000, 40);

          const qrImg = new Image();
          qrImg.onload = () => {
            const qrSize = 1450;
            const startX = (2000 - qrSize) / 2;
            const startY = 160;

            // Outer QR Frame Border
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 12;
            ctx.strokeRect(startX - 20, startY - 20, qrSize + 40, qrSize + 40);

            // Draw Real Valid QR Code
            ctx.drawImage(qrImg, startX, startY, qrSize, qrSize);

            // Footer Student Details
            ctx.textAlign = 'center';
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 58px sans-serif';
            ctx.fillText(student.name.toUpperCase(), 1000, 1750);

            ctx.fillStyle = '#047857';
            ctx.font = 'bold 44px monospace';
            ctx.fillText(`NISN: ${nisnVal}`, 1000, 1830);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '500 32px sans-serif';
            ctx.fillText('SIMADRASAH - Presensi QR Code Siswa', 1000, 1920);

            resolve(canvas.toDataURL('image/png'));
          };
          qrImg.src = qrBase64;
        }).catch(err => {
          console.error('Error generating HD QR:', err);
          resolve('');
        });
      });
    }
