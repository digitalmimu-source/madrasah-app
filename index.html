    function generateHDQRCodeCanvas(student, format = 'qr_only') {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 2000;
        canvas.height = 2000;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 2000, 2000);

        ctx.fillStyle = '#047857';
        ctx.fillRect(0, 0, 2000, 40);

        const qrSize = 1450;
        const startX = (2000 - qrSize) / 2;
        const startY = 160;

        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 12;
        ctx.strokeRect(startX - 20, startY - 20, qrSize + 40, qrSize + 40);

        const str = String(student.nisn || '0000000000');
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = (hash << 5) - hash + str.charCodeAt(i);
          hash |= 0;
        }

        const gridSize = 21;
        const cellSize = qrSize / gridSize;
        ctx.fillStyle = '#0f172a';

        for (let r = 0; r < gridSize; r++) {
          for (let c = 0; c < gridSize; c++) {
            const isCornerTL = r < 5 && c < 5;
            const isCornerTR = r < 5 && c >= gridSize - 5;
            const isCornerBL = r >= gridSize - 5 && c < 5;

            if (isCornerTL || isCornerTR || isCornerBL) {
              const isBorder = r === 0 || r === 4 || c === 0 || c === 4 ||
                               r === gridSize - 1 || r === gridSize - 5 ||
                               c === gridSize - 1 || c === gridSize - 5;
              const isCenter = (r >= 1 && r <= 3) && (c >= 1 && c <= 3) ||
                               (r >= 1 && r <= 3) && (c >= gridSize - 4 && c <= gridSize - 2) ||
                               (r >= gridSize - 4 && r <= gridSize - 2) && (c >= 1 && c <= 3);
              if (isBorder || isCenter) {
                ctx.fillRect(startX + c * cellSize, startY + r * cellSize, cellSize - 1, cellSize - 1);
              }
            } else {
              const seed = Math.sin(hash + r * gridSize + c) * 10000;
              if ((seed - Math.floor(seed)) > 0.45) {
                ctx.fillRect(startX + c * cellSize, startY + r * cellSize, cellSize - 1, cellSize - 1);
              }
            }
          }
        }

        ctx.textAlign = 'center';
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 58px sans-serif';
        ctx.fillText(student.name.toUpperCase(), 1000, 1750);

        ctx.fillStyle = '#047857';
        ctx.font = 'bold 44px monospace';
        ctx.fillText(`NISN: ${student.nisn}`, 1000, 1830);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 32px sans-serif';
        ctx.fillText('SIMADRASAH - Presensi QR Code Siswa', 1000, 1920);

        resolve(canvas.toDataURL('image/png'));
      });
    }

              {activeTab === 'guru' && <GuruModule teachers={teachers} setTeachers={setTeachers} currentUser={currentUser} onSync={handleSyncDrive} />}
              {activeTab === 'penilaian' && <PenilaianModule students={students} studentGrades={studentGrades} setStudentGrades={setStudentGrades} onSync={handleSyncDrive} />}
              {activeTab === 'pelanggaran' && <PelanggaranModule students={students} masterViolations={masterViolations} setMasterViolations={setMasterViolations} violationLogs={violationLogs} setViolationLogs={setViolationLogs} onSync={handleSyncDrive} />}

              masterViolations={masterViolations}

              setJournals={setJournals}
              setMasterViolations={setMasterViolations}
              setViolationLogs={setViolationLogs}
              setAttendanceLogs={setAttendanceLogs}
              setStudentGrades={setStudentGrades}
            />
          )}
        </div>
      );
    }

    function AbsensiQRModule({ students, attendanceLogs, setAttendanceLogs, onSync }) {
      const [manualNisn, setManualNisn] = useState('');
      const [isCameraActive, setIsCameraActive] = useState(false);
      const [scanStatusMsg, setScanStatusMsg] = useState('');
      const [facingMode, setFacingMode] = useState('environment'); // environment / user
      const html5QrCodeRef = useRef(null);

      // Play Beep Audio feedback
      const playBeep = () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        } catch (e) {}
      };

      const recordAttendance = (student) => {
        const today = new Date().toISOString().split('T')[0];
        const nowTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        const newLog = {
          id: Date.now(),
          studentId: student.id,
          studentName: student.name,
          nisn: student.nisn,
          studentClass: student.class,
          date: today,
          time: nowTime,
          status: 'Hadir'
        };

        playBeep();
        setAttendanceLogs(prev => [newLog, ...prev]);
        setScanStatusMsg(`✅ Presensi Berhasil: ${student.name} (Kelas ${student.class})`);
        setTimeout(() => setScanStatusMsg(''), 4000);

        if (onSync) onSync();
      };

      const handleNisnSearchAndRecord = (queryNisn) => {
        const clean = queryNisn.trim();
        if (!clean) return;

        const found = students.find(s => String(s.nisn).trim() === clean);
        if (found) {
          recordAttendance(found);
          setManualNisn('');
        } else {
          setScanStatusMsg(`⚠️ NISN "${clean}" tidak ditemukan dalam sistem!`);
          setTimeout(() => setScanStatusMsg(''), 4000);
        }
      };

      const startScanner = async () => {
        if (!window.Html5Qrcode) {
          alert('Library HTML5-QRCode belum dimuat. Mohon periksa koneksi internet Anda.');
          return;
        }

        setIsCameraActive(true);
        setScanStatusMsg('Menghubungkan ke Kamera HP...');

        setTimeout(async () => {
          try {
            if (html5QrCodeRef.current) {
              await html5QrCodeRef.current.stop().catch(() => {});
            }

            const html5QrCode = new window.Html5Qrcode("reader");
            html5QrCodeRef.current = html5QrCode;

            await html5QrCode.start(
              { facingMode: facingMode },
              { fps: 10, qrbox: { width: 250, height: 250 } },
              (decodedText) => {
                // Succeeded QR Scan
                handleNisnSearchAndRecord(decodedText);
              },
              (errorMessage) => {
                // Ignore frame parse errors
              }
            );
            setScanStatusMsg('Arahkan QR Code NISN Siswa ke Kamera');
          } catch (err) {
            console.error(err);
            setScanStatusMsg('⚠️ Gagal mengakses kamera. Pastikan izin kamera telah diberikan.');
            setIsCameraActive(false);
          }
        }, 300);
      };

      const stopScanner = async () => {
        if (html5QrCodeRef.current) {
          try {
            await html5QrCodeRef.current.stop();
            html5QrCodeRef.current = null;
          } catch (err) {}
        }
        setIsCameraActive(false);
        setScanStatusMsg('');
      };

      useEffect(() => {
        return () => {
          if (html5QrCodeRef.current) {
            html5QrCodeRef.current.stop().catch(() => {});
          }
        };
      }, []);

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-emerald-800 to-teal-800 rounded-3xl p-6 sm:p-8 text-white shadow-lg relative overflow-hidden">
            <div className="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div className="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold mb-3 border border-white/20">
                  <Icon name="QrCode" size={14} /> Presensi Berbasis NISN Permanen (Kelas 1 - 6)
                </div>
                <h2 className="text-2xl sm:text-3xl font-black">Presensi Live QR Code</h2>
                <p className="text-emerald-100 text-xs sm:text-sm mt-1 max-w-xl">
                  Gunakan kamera HP / Webcam secara langsung atau simulasikan pencatatan presensi siswa.
                </p>
              </div>
            </div>
          </div>

          {scanStatusMsg && (
            <div className={`p-4 rounded-2xl text-xs font-bold flex items-center gap-2 shadow-sm ${
              scanStatusMsg.includes('⚠️') ? 'bg-rose-100 border border-rose-300 text-rose-900' : 'bg-emerald-100 border border-emerald-300 text-emerald-900'
            }`}>
              <Icon name={scanStatusMsg.includes('⚠️') ? "AlertTriangle" : "CheckCircle"} size={18} />
              <span>{scanStatusMsg}</span>
            </div>
          )}

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Left: QR Scanner Panel */}
            <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-xs space-y-4">
              <h3 className="font-bold text-sm text-slate-800 flex items-center justify-between border-b border-slate-100 pb-3">
                <span className="flex items-center gap-2"><Icon name="Camera" className="text-emerald-700" size={18} /> Pemindai QR Code</span>
                {isCameraActive && (
                  <button
                    onClick={() => {
                      setFacingMode(prev => prev === 'environment' ? 'user' : 'environment');
                      stopScanner().then(() => startScanner());
                    }}
                    className="text-[10px] font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-lg"
                  >
                    Ganti Kamera
                  </button>
                )}
              </h3>

              <div className="relative bg-slate-900 rounded-2xl overflow-hidden min-h-[260px] flex flex-col items-center justify-center text-center p-2 text-slate-300">
                <div id="reader" className="w-full"></div>

                {!isCameraActive && (
                  <div className="p-6 space-y-3">
                    <div className="w-20 h-20 bg-white/10 rounded-2xl mx-auto flex items-center justify-center border border-white/20">
                      <Icon name="QrCode" size={36} className="text-emerald-400" />
                    </div>
                    <p className="text-xs text-slate-300 font-medium">Kamera belum aktif</p>
                    <button
                      onClick={startScanner}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs shadow-md transition cursor-pointer inline-flex items-center gap-2"
                    >
                      <Icon name="Camera" size={16} /> Aktifkan Kamera HP
                    </button>
                  </div>
                )}

                {isCameraActive && (
                  <button
                    onClick={stopScanner}
                    className="mt-3 bg-rose-600 hover:bg-rose-700 text-white font-bold px-4 py-1.5 rounded-xl text-xs cursor-pointer inline-flex items-center gap-1.5"
                  >
                    <Icon name="X" size={14} /> Matikan Kamera
                  </button>
                )}
              </div>

              {/* Manual NISN Input */}
              <div className="space-y-2 pt-2 border-t border-slate-100">
                <label className="block text-[11px] font-bold text-slate-500 uppercase tracking-wider">Input Manual NISN Siswa:</label>
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={manualNisn}
                    onChange={e => setManualNisn(e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && handleNisnSearchAndRecord(manualNisn)}
                    placeholder="Ketik NISN lalu tekan Enter..."
                    className="flex-1 p-2.5 border border-slate-200 rounded-xl text-xs font-mono outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                  <button
                    onClick={() => handleNisnSearchAndRecord(manualNisn)}
                    className="bg-emerald-800 text-white px-3.5 py-2.5 rounded-xl font-bold text-xs hover:bg-emerald-900 cursor-pointer"
                  >
                    Proses
                  </button>
                </div>
              </div>

              {/* Fast Simulation Bar */}
              <div className="space-y-2 pt-2 border-t border-slate-100">
                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Simulasi Scan Cepat (1-Klik):</p>
                <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                  {students.map((s) => (
                    <button
                      key={s.id}
                      type="button"
                      onClick={() => recordAttendance(s)}
                      className="w-full text-left p-2.5 bg-slate-50 hover:bg-emerald-50 hover:border-emerald-200 border border-slate-100 rounded-xl transition cursor-pointer flex items-center justify-between"
                    >
                      <div>
                        <p className="font-bold text-xs text-slate-800">{s.name}</p>
                        <p className="text-[10px] text-slate-400 font-mono">NISN: {s.nisn} | Kelas {s.class}</p>
                      </div>
                      <span className="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-2 py-1 rounded-md">Scan</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {/* Right: Attendance Logs */}
            <div className="lg:col-span-2 bg-white rounded-3xl border border-slate-100 shadow-xs p-6 space-y-4">
              <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 className="font-bold text-sm text-slate-800 flex items-center gap-2">
                  <Icon name="Clock" className="text-emerald-700" size={18} /> Log Riwayat Presensi Masuk Siswa
                </h3>
                <span className="text-xs font-bold text-emerald-800 bg-emerald-50 px-3 py-1 rounded-full">
                  {attendanceLogs.length} Siswa Hadir
                </span>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-50 text-[10px] font-bold text-slate-400 uppercase border-b border-slate-100">
                      <th className="py-2.5 px-3">Waktu</th>
                      <th className="py-2.5 px-3">Siswa & NISN</th>
                      <th className="py-2.5 px-3">Kelas</th>
                      <th className="py-2.5 px-3">Status</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 text-xs">
                    {attendanceLogs.length === 0 ? (
                      <tr>
                        <td colSpan={4} className="py-8 text-center text-slate-400">
                          Belum ada pemindaian presensi hari ini.
                        </td>
                      </tr>
                    ) : (
                      attendanceLogs.map((log) => (
                        <tr key={log.id} className="hover:bg-slate-50 transition">
                          <td className="py-2.5 px-3 font-mono font-bold text-slate-700">{log.time}</td>
                          <td className="py-2.5 px-3">
                            <p className="font-bold text-slate-800">{log.studentName}</p>
                            <p className="text-[10px] text-slate-400 font-mono">{log.nisn}</p>
                          </td>
                          <td className="py-2.5 px-3 font-bold text-emerald-800">Kelas {log.studentClass}</td>
                          <td className="py-2.5 px-3">
                            <span className="bg-emerald-100 text-emerald-800 font-bold px-2.5 py-0.5 rounded-full text-[10px]">
                              {log.status}
                            </span>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function JurnalModule({ journals, setJournals, currentUser, onSync }) {
      const [searchTerm, setSearchTerm] = useState('');

      const [startHour, setStartHour] = useState('1');
      const [endHour, setEndHour] = useState('2');

      const [formData, setFormData] = useState({
        date: new Date().toISOString().split('T')[0],
        className: '1',
        subject: SUBJECT_LIST[0],
        topic: '',
        status: 'Selesai',
        notes: ''
      });

      const filteredJournals = journals.filter((j) => {
        const matchSearch =
          j.subject.toLowerCase().includes(searchTerm.toLowerCase()) ||
          j.topic.toLowerCase().includes(searchTerm.toLowerCase()) ||
          j.teacher.toLowerCase().includes(searchTerm.toLowerCase());
        const matchClass = selectedClass === 'Semua' || j.className === selectedClass;
        return matchSearch && matchClass;
      });

      const handleAddJournal = (e) => {
        e.preventDefault();
        if (!formData.topic) return;

        const timeSlotString = startHour === endHour
          ? `Jam ke-${startHour}`
          : `Jam ke-${startHour} & ${endHour}`;

        const newEntry = {
          id: Date.now(),
          ...formData,
          timeSlot: timeSlotString,
          teacher: currentUser.name
        };

        setJournals([newEntry, ...journals]);
        setIsModalOpen(false);
        setFormData({
          date: new Date().toISOString().split('T')[0],
          className: '1',
          subject: SUBJECT_LIST[0],
          topic: '',
          status: 'Selesai',
          notes: ''
        });

        if (onSync) onSync();

      const handleDeleteJournal = (id) => {
        if (window.confirm('Hapus entri jurnal mengajar ini?')) {
          setJournals(journals.filter(j => j.id !== id));
          if (onSync) onSync();

      return (
        <div className="space-y-6">

            <div className="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-4">

                <div className="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold mb-3 border border-white/20">
                  <Icon name="BookOpen" size={14} /> Jurnal KBM Kelas 1 s/d 6
                </div>
                <h2 className="text-2xl sm:text-3xl font-black">Jurnal Mengajar Guru</h2>
                <p className="text-emerald-100 text-xs sm:text-sm mt-1 max-w-xl">
                  Catat jurnal harian, pilih rentang jam ke-1 s/d ke-8, serta mata pelajaran lengkap.
                </p>
              </div>

              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => setIsModalOpen(true)}
                  className="bg-white text-emerald-800 hover:bg-emerald-50 font-bold px-4 py-2.5 rounded-xl text-xs shadow-md transition flex items-center gap-1.5 cursor-pointer shrink-0"
                >
                  <Icon name="Plus" size={16} /> + Tambah Jurnal
                </button>
              </div>
            </div>
          </div>

          {/* Filters */}
          <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs flex flex-col sm:flex-row gap-3 items-center justify-between">
            <div className="relative flex-1 w-full">
              <input
                type="text"
                placeholder="Cari mapel, topik materi, atau pengajar..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="w-full p-2.5 border border-slate-200 rounded-xl text-xs outline-none"
              />
            </div>
            <select
              value={selectedClass}
              onChange={(e) => setSelectedClass(e.target.value)}
              className="p-2.5 border border-slate-200 rounded-xl text-xs font-bold text-slate-600 bg-white outline-none"
            >
              <option value="Semua">Semua Kelas (1 - 6)</option>

            </select>
          </div>

          {/* Table */}

              <table className="w-full text-left border-collapse">

                    <th className="py-3.5 px-4">Pengajar</th>

                      <td className="py-3.5 px-4">

                  <button type="button" onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 p-1">
                    <Icon name="X" size={20} />
                  </button>
                </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Tanggal KBM</label>
                    <input
                      type="date"
                      value={formData.date}
                      onChange={(e) => setFormData({ ...formData, date: e.target.value })}
                      className="w-full p-2.5 border border-slate-200 rounded-xl outline-none"
                      required
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Dari Jam Ke-</label>
                      <select value={startHour} onChange={e => setStartHour(e.target.value)} className="w-full p-2 border rounded-xl outline-none bg-white font-bold text-emerald-800">
                        {[1, 2, 3, 4, 5, 6, 7, 8].map(h => <option key={h} value={h}>Jam ke-{h}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Sampai Jam Ke-</label>
                      <select value={endHour} onChange={e => setEndHour(e.target.value)} className="w-full p-2 border rounded-xl outline-none bg-white font-bold text-emerald-800">
                        {[1, 2, 3, 4, 5, 6, 7, 8].map(h => <option key={h} value={h}>Jam ke-{h}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">

                      <label className="block font-bold text-slate-700 mb-1">Kelas Target (1-6)</label>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Catatan KBM Tambahan</label>

                      value={formData.notes}
                      onChange={(e) => setFormData({ ...formData, notes: e.target.value })}

                </form>
              </div>
            </div>
          )}
        </div>

                {violationLogs.map(v => (
                  <tr key={v.id} className="border-b">
                    <td className="p-2 font-bold">{v.date}</td>
                    <td className="p-2 font-bold">{v.studentName}<br/><span className="text-[10px] text-slate-400">Kelas {v.studentClass}</span></td>
                    <td className="p-2 text-rose-800 font-bold">{v.violationName}</td>
                    <td className="p-2 font-bold text-rose-700">+{v.points} Pts</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function GoogleSheetsModal({
      spreadsheetUrl,
      setSpreadsheetUrl,
      onClose,
      teachers,
      students,
      journals,
      masterViolations,
      violationLogs,
      attendanceLogs,
      studentGrades
    }) {
      const [urlInput, setUrlInput] = useState(spreadsheetUrl);
      const [savedMsg, setSavedMsg] = useState('');

      const handleSave = () => {
        localStorage.setItem('simadrasah_sheet_url', urlInput);
        setSpreadsheetUrl(urlInput);
        setSavedMsg('✅ URL Database Google Sheets berhasil disimpan!');
        setTimeout(() => {
          setSavedMsg('');
          onClose();
        }, 1500);
      };

      const handleExportJSON = () => {
        const backupData = {
          teachers,
          students,
          journals,
          masterViolations,
          violationLogs,
          attendanceLogs,
          studentGrades,
          exportDate: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `SIMADRASAH_Backup_${new Date().toISOString().split('T')[0]}.json`;
        link.click();
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-white max-w-lg w-full p-6 rounded-3xl space-y-4 shadow-2xl overflow-y-auto max-h-[90vh]">
            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
              <h3 className="font-bold text-base flex items-center gap-2 text-slate-800">
                <Icon name="Settings" className="text-emerald-700" size={20} /> Pengaturan Database & Aplikasi
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1 cursor-pointer">
                <Icon name="X" size={20} />
              </button>
            </div>

            {savedMsg && (
              <div className="p-3 bg-emerald-100 border border-emerald-300 text-emerald-900 rounded-xl text-xs font-bold">
                {savedMsg}
              </div>
            )}

            <div className="space-y-4 text-xs">
              <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl space-y-2">
                <label className="block font-bold text-emerald-900 text-xs">
                  <Icon name="Database" size={14} className="inline mr-1" /> Web App Endpoint (Google Apps Script)
                </label>
                <input
                  type="text"
                  value={urlInput}
                  onChange={(e) => setUrlInput(e.target.value)}
                  placeholder="https://script.google.com/macros/s/.../exec"
                  className="w-full p-2.5 bg-white border border-emerald-300 rounded-xl text-xs font-mono outline-none focus:ring-2 focus:ring-emerald-500"
                />
                <p className="text-[11px] text-emerald-700">
                  Masukkan Web App URL dari Google Apps Script untuk menghubungkan data dengan Google Sheets.
                </p>
              </div>

              <div className="border border-slate-200 p-4 rounded-2xl space-y-3">
                <p className="font-bold text-slate-800">Cadangan Data (Backup):</p>
                <button
                  type="button"
                  onClick={handleExportJSON}
                  className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 px-3 rounded-xl transition flex items-center justify-center gap-2 cursor-pointer text-xs"
                >
                  <Icon name="Download" size={14} /> Unduh Backup Data (JSON)
                </button>
              </div>
            </div>

            <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
              <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-100 rounded-xl font-bold text-slate-600 cursor-pointer text-xs">
                Tutup
              </button>
              <button type="button" onClick={handleSave} className="px-5 py-2 bg-emerald-800 text-white rounded-xl font-bold hover:bg-emerald-900 shadow-md cursor-pointer text-xs">
                Simpan Pengaturan
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
